<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أسعار الحاويات - مكتب الصفا</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f7;
  margin: 0;
}

* {
  box-sizing: border-box;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #2c3e50;
  color: white;
  padding: 10px 20px;
  gap: 12px;
  flex-wrap: wrap;
}

header img {
  height: 60px;
}

.container {
  width: min(1200px, calc(100% - 24px));
  margin: 20px auto;
  text-align: center;
}

input {
  padding: 12px;
  width: 100%;
  border-radius: 10px;
  border: 1px solid #ccc;
  margin-bottom: 15px;
  font-size: 16px;
}

.table-wrap {
  overflow-x: auto;
  overflow-y: visible;
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(44, 62, 80, 0.08);
  position: relative;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  border-radius: 10px;
  overflow: hidden;
  min-width: 1100px;
}

th, td {
  border: 1px solid #ddd;
  padding: 10px 8px;
  text-align: center;
  white-space: nowrap;
}

tr:nth-child(even) {
  background: #f9f9f9;
}

thead th {
  color: #1f2937;
  background: #eaf2f8;
  font-weight: bold;
  position: sticky;
  top: 0;
  z-index: 8;
}

thead tr:first-child th {
  top: 0;
}

thead tr:nth-child(2) th {
  top: 43px;
  z-index: 9;
}

.header-row {
  background: #3498db !important;
  color: white !important;
  font-weight: bold;
}

.market-col {
  background: #d6eaf8;
  font-weight: bold;
  color: #1f2937;
}

.client-col {
  background: #f8d7da;
  font-weight: bold;
  color: #1f2937;
}

.notes-col {
  min-width: 180px;
}

button {
  padding: 10px 15px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  margin: 5px;
}

.save-btn { background: #27ae60; color: white; }
.delete-btn { background: #e74c3c; color: white; }
.add-btn { background: #2980b9; color: white; }

.top-buttons {
  margin-bottom: 10px;
  margin-top: 12px;
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}

header h2 {
  margin: 0;
  font-size: clamp(1rem, 2.4vw, 1.5rem);
}

header > div {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

@media (max-width: 768px) {
  header {
    padding: 12px;
  }

  header img {
    height: 50px;
  }

  .container {
    width: min(100% - 16px, 1000px);
    margin: 14px auto 20px;
  }

  input {
    font-size: 15px;
    padding: 10px;
  }

  button {
    font-size: 14px;
    padding: 10px 12px;
  }

  .top-buttons button,
  header > div button {
    flex: 1 1 140px;
  }

  .table-wrap {
    overflow-x: auto;
  }

  th,
  td {
    padding: 9px 7px;
    font-size: 14px;
  }

  thead tr:nth-child(2) th {
    top: 41px;
  }
}

@media (max-width: 480px) {
  .container {
    width: calc(100% - 12px);
  }

  th,
  td {
    font-size: 13px;
    padding: 8px 6px;
  }

  .table-wrap {
    overflow-x: auto;
  }

  thead tr:nth-child(2) th {
    top: 39px;
  }
}
</style>
</head>

<body>

<header>
  <img src="logo.png" alt="شعار مكتب الصفا">
  <h2>أسعار الحاويات - مكتب الصفا</h2>
  <div>
    <button onclick="goBack()">رجوع</button>
    <button onclick="logout()">تسجيل خروج</button>
  </div>
</header>

<div class="container">

<input type="text" id="search" placeholder="اكتب المكان أو العميل أو الملاحظات..." onkeyup="searchData()">

<div class="table-wrap">
<table>
<thead>
<tr>
<th rowspan="2">العميل</th>
<th rowspan="2">المكان</th>
<th colspan="3" class="header-row market-col">سعر السوق</th>
<th rowspan="2">قومسيون</th>
<th colspan="3" class="header-row client-col">سعر العميل</th>
<th rowspan="2" class="notes-col">ملاحظات</th>
<th rowspan="2">حذف</th>
</tr>

<tr>
<th class="market-col">20</th>
<th class="market-col">40</th>
<th class="market-col">2×20</th>
<th class="client-col">20</th>
<th class="client-col">40</th>
<th class="client-col">2×20</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>
</div>

<div class="top-buttons">
  <button class="add-btn" onclick="addRow()">إضافة بيانات جديدة</button>
  <button class="save-btn" onclick="saveAll()">حفظ التعديلات</button>
  <button class="import-btn" onclick="document.getElementById('excelFile').click()">Import Excel</button>
  <input type="file" id="excelFile" accept=".xlsx,.xls" style="display: none;" onchange="handleFileSelect(event)">
</div>

<!-- Excel Import Section -->
<div id="importSection" style="display: none; margin: 20px 0; padding: 20px; background: #f8f9fa; border-radius: 10px; border: 1px solid #dee2e6;">
  <h3 style="margin-top: 0; color: #2c3e50;">Excel Import Preview</h3>
  
  <div id="importInfo" style="margin-bottom: 15px; color: #6c757d;">
    <p>File: <span id="fileName"></span></p>
    <p>Total Rows: <span id="totalRows">0</span></p>
    <p>Valid Rows: <span id="validRows">0</span></p>
  </div>

  <div class="table-wrap" style="max-height: 400px; overflow-y: auto;">
    <table id="previewTable" style="background: white;">
      <thead>
        <tr>
          <th>اسم العميل</th>
          <th>المكان</th>
          <th>20</th>
          <th>40</th>
          <th>2*20</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="previewBody">
        <!-- Preview data will be loaded here -->
      </tbody>
    </table>
  </div>

  <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: center;">
    <button class="save-btn" onclick="confirmImport()">Upload Data</button>
    <button class="delete-btn" onclick="cancelImport()">Cancel</button>
  </div>
</div>

<!-- Loading Indicator -->
<div id="loadingOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
  <div style="background: white; padding: 30px; border-radius: 10px; text-align: center;">
    <div style="border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px;"></div>
    <p id="loadingText">Processing...</p>
  </div>
</div>

<style>
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.import-btn {
  background: #8e44ad;
  color: white;
}

.import-btn:hover {
  background: #7d3c98;
}

#previewTable {
  border-collapse: collapse;
  width: 100%;
  font-size: 14px;
}

#previewTable th {
  background: #3498db;
  color: white;
  padding: 10px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 10;
}

#previewTable td {
  padding: 8px;
  border: 1px solid #dee2e6;
  text-align: center;
}

.status-valid {
  background: #d4edda;
  color: #155724;
}

.status-invalid {
  background: #f8d7da;
  color: #721c24;
}

.status-duplicate {
  background: #fff3cd;
  color: #856404;
}
</style>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyARqSgfh78TqFQ2hhZaAtUaVQFqlPuRM3w",
  authDomain: "trialsafaprices2026.firebaseapp.com",
  databaseURL: "https://trialsafaprices2026-default-rtdb.firebaseio.com",
  projectId: "trialsafaprices2026",
  storageBucket: "trialsafaprices2026.appspot.com",
  messagingSenderId: "177091434445",
  appId: "1:177091434445:web:568b6ae3ba270a21d4d684"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

firebase.auth().onAuthStateChanged(user => {
  if (!user) window.location = "index.html";
});

let data = [];
let filteredData = null;
let excelPreviewData = [];
let currentFileName = "";

// Excel Import Functions
function handleFileSelect(event) {
  const file = event.target.files[0];
  if (!file) return;

  // Check file type
  if (!file.name.match(/\.(xlsx|xls)$/)) {
    alert('Please select a valid Excel file (.xlsx or .xls)');
    return;
  }

  // Check for duplicate upload
  if (checkDuplicateUpload(file.name)) {
    if (!confirm('Warning: You uploaded this file recently. Do you want to continue?')) {
      document.getElementById('excelFile').value = '';
      return;
    }
  }

  currentFileName = file.name;
  showLoading('Reading Excel file...');
  
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      
      // Get first worksheet
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
      
      processExcelData(jsonData);
    } catch (error) {
      hideLoading();
      alert('Error reading Excel file: ' + error.message);
      document.getElementById('excelFile').value = '';
    }
  };
  
  reader.readAsArrayBuffer(file);
}

function processExcelData(jsonData) {
  try {
    console.log('Processing Excel data, raw data:', jsonData);
    
    // Skip header row and process data
    const rows = jsonData.slice(1);
    excelPreviewData = [];
    
    let validCount = 0;
    let invalidCount = 0;
    
    console.log('Current data for duplicate check:', data);
    
    rows.forEach((row, index) => {
      console.log(`Processing row ${index + 2}:`, row);
      
      if (row.length < 5) {
        console.log(`Row ${index + 2} invalid: insufficient columns (${row.length})`);
        invalidCount++;
        return;
      }
      
      const clientName = String(row[0] || '').trim(); // اسم العميل
      const place = String(row[1] || '').trim(); // المكان
      const c20 = Number(row[2]) || 0; // 20
      const c40 = Number(row[3]) || 0; // 40
      const c2x20 = Number(row[4]) || 0; // 2*20
      
      console.log(`Parsed data - Client: "${clientName}", Place: "${place}", 20: ${c20}, 40: ${c40}, 2x20: ${c2x20}`);
      
      // Validation
      if (!clientName || !place) {
        console.log(`Row ${index + 2} invalid: missing client name or place`);
        invalidCount++;
        return;
      }
      
      // Check if row already exists in current data
      let existingIndex = -1;
      if (data && Array.isArray(data)) {
        existingIndex = data.findIndex(item => 
          item && item.clientName === clientName && item.place === place
        );
      }
      
      console.log(`Found existing index: ${existingIndex}`);
      
      excelPreviewData.push({
        clientName,
        place,
        c20,
        c40,
        c2x20,
        existingIndex: existingIndex >= 0 ? existingIndex : null,
        status: existingIndex >= 0 ? 'duplicate' : 'new',
        rowIndex: index + 2 // Excel row number (1-indexed + header)
      });
      
      validCount++;
      console.log(`Row ${index + 2} added as ${existingIndex >= 0 ? 'duplicate' : 'new'}`);
    });
    
    console.log(`Processing complete. Valid: ${validCount}, Invalid: ${invalidCount}`);
    console.log('Excel preview data:', excelPreviewData);
    
    hideLoading();
    showImportPreview(validCount, invalidCount);
    
  } catch (error) {
    console.error('Error in processExcelData:', error);
    hideLoading();
    alert('Error processing Excel data: ' + error.message);
  }
}

function showImportPreview(validCount, invalidCount) {
  // Update import info
  document.getElementById('fileName').textContent = currentFileName;
  document.getElementById('totalRows').textContent = excelPreviewData.length;
  document.getElementById('validRows').textContent = validCount;
  
  // Render preview table
  const tbody = document.getElementById('previewBody');
  tbody.innerHTML = '';
  
  excelPreviewData.forEach(row => {
    const tr = document.createElement('tr');
    
    let statusText = '';
    let statusClass = '';
    
    if (row.status === 'new') {
      statusText = 'New';
      statusClass = 'status-valid';
    } else if (row.status === 'duplicate') {
      statusText = 'Will Update';
      statusClass = 'status-duplicate';
    }
    
    tr.innerHTML = `
      <td>${row.clientName}</td>
      <td>${row.place}</td>
      <td>${row.c20}</td>
      <td>${row.c40}</td>
      <td>${row.c2x20}</td>
      <td class="${statusClass}">${statusText}</td>
    `;
    
    tbody.appendChild(tr);
  });
  
  // Show import section
  document.getElementById('importSection').style.display = 'block';
  
  // Scroll to import section
  document.getElementById('importSection').scrollIntoView({ behavior: 'smooth' });
}

function cancelImport() {
  document.getElementById('importSection').style.display = 'none';
  document.getElementById('excelFile').value = '';
  excelPreviewData = [];
  currentFileName = '';
}

function confirmImport() {
  if (!confirm(`Are you sure you want to import ${excelPreviewData.length} rows? This will update client prices only.`)) {
    return;
  }
  
  console.log('Starting import process...');
  console.log('Excel preview data:', excelPreviewData);
  
  showLoading('Importing data to Firebase...');
  
  // Add timeout to prevent infinite loading
  const timeout = setTimeout(() => {
    console.error('Import timeout reached');
    hideLoading();
    alert('Import timed out. Please check your internet connection and try again.');
  }, 30000); // 30 seconds timeout
  
  // Load current data from Firebase
  database.ref('prices').once('value', { timeout: 20000 })
    .then(snapshot => {
      clearTimeout(timeout);
      console.log('Firebase data loaded successfully');
      let currentData = snapshot.val();
      
      // Handle case where data might be null or not an array
      if (!currentData || !Array.isArray(currentData)) {
        console.log('Initializing empty data array');
        currentData = [];
      }
      
      console.log('Current data length:', currentData.length);
      
      // Process each row
      excelPreviewData.forEach(excelRow => {
        const { clientName, place, c20, c40, c2x20, existingIndex } = excelRow;
        
        if (existingIndex >= 0 && existingIndex < currentData.length) {
          // Update existing row - only update client prices
          console.log(`Updating existing row: ${clientName} - ${place}`);
          if (!currentData[existingIndex]) {
            currentData[existingIndex] = {};
          }
          if (!currentData[existingIndex].client) {
            currentData[existingIndex].client = {};
          }
          currentData[existingIndex].client.c20 = c20;
          currentData[existingIndex].client.c40 = c40;
          currentData[existingIndex].client.c2x20 = c2x20;
        } else {
          // Create new row with default values
          console.log(`Creating new row: ${clientName} - ${place}`);
          currentData.push({
            clientName: clientName,
            place: place,
            market: { c20: 0, c40: 0, c2x20: 0 },
            commission: 0,
            client: { c20: c20, c40: c40, c2x20: c2x20 },
            notes: ""
          });
        }
      });
      
      console.log('Final data to save:', currentData);
      
      // Show progress update
      showLoading('Saving data to Firebase...');
      
      // Save to Firebase with retry mechanism
      return database.ref('prices').set(currentData);
    })
    .then(() => {
      clearTimeout(timeout);
      console.log('Data saved successfully to Firebase');
      hideLoading();
      alert(`Successfully imported ${excelPreviewData.length} rows!`);
      recordUpload(currentFileName);
      cancelImport();
      // Data will automatically reload via the existing listener
    })
    .catch(error => {
      clearTimeout(timeout);
      console.error('Firebase error:', error);
      hideLoading();
      
      // Provide more specific error messages
      let errorMessage = 'Error saving data: ';
      if (error.code === 'PERMISSION_DENIED') {
        errorMessage += 'Permission denied. Check Firebase rules.';
      } else if (error.code === 'NETWORK_ERROR') {
        errorMessage += 'Network error. Check your internet connection.';
      } else if (error.code === 'TIMEOUT') {
        errorMessage += 'Request timeout. Please try again.';
      } else {
        errorMessage += error.message || 'Unknown error occurred.';
      }
      
      alert(errorMessage);
    });
}

function showLoading(text = 'Processing...') {
  document.getElementById('loadingText').textContent = text;
  document.getElementById('loadingOverlay').style.display = 'flex';
}

function hideLoading() {
  document.getElementById('loadingOverlay').style.display = 'none';
}

// Check for duplicate upload prevention
function checkDuplicateUpload(fileName) {
  const lastUpload = localStorage.getItem('lastExcelUpload');
  const lastFileName = localStorage.getItem('lastExcelFileName');
  
  if (lastUpload && lastFileName === fileName) {
    const lastUploadTime = new Date(lastUpload);
    const now = new Date();
    const hoursDiff = (now - lastUploadTime) / (1000 * 60 * 60);
    
    if (hoursDiff < 1) {
      return true; // Duplicate upload within 1 hour
    }
  }
  
  return false;
}

function recordUpload(fileName) {
  localStorage.setItem('lastExcelUpload', new Date().toISOString());
  localStorage.setItem('lastExcelFileName', fileName);
}

function syncTableToData() {
  const rows = document.querySelectorAll("#tableBody tr");

  data = Array.from(rows).map(tr => {
    const cells = tr.children;

    return {
      clientName: cells[0].innerText.trim(),
      place: cells[1].innerText.trim(),
      market: {
        c20: Number(cells[2].innerText) || 0,
        c40: Number(cells[3].innerText) || 0,
        c2x20: Number(cells[4].innerText) || 0
      },
      commission: Number(cells[5].innerText) || 0,
      client: {
        c20: Number(cells[6].innerText) || 0,
        c40: Number(cells[7].innerText) || 0,
        c2x20: Number(cells[8].innerText) || 0
      },
      notes: cells[9].innerText.trim()
    };
  });
}

function loadData() {
  database.ref("prices").on("value", snapshot => {
    data = snapshot.val() || [];
    renderTable(data);
  });
}

function renderTable(list) {
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";

  list.forEach((row, index) => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td contenteditable="true">${row.clientName || ""}</td>
      <td contenteditable="true">${row.place || ""}</td>
      <td class="market-col" contenteditable="true">${row.market?.c20 || 0}</td>
      <td class="market-col" contenteditable="true">${row.market?.c40 || 0}</td>
      <td class="market-col" contenteditable="true">${row.market?.c2x20 || 0}</td>
      <td contenteditable="true">${row.commission || 0}</td>
      <td class="client-col" contenteditable="true">${row.client?.c20 || 0}</td>
      <td class="client-col" contenteditable="true">${row.client?.c40 || 0}</td>
      <td class="client-col" contenteditable="true">${row.client?.c2x20 || 0}</td>
      <td class="notes-col" contenteditable="true">${row.notes || ""}</td>
      <td><button class="delete-btn" onclick="deleteRow(${index})">❌</button></td>
    `;

    tbody.appendChild(tr);
  });
}

function searchData() {
  const q = document.getElementById("search").value.toLowerCase();

  if (!q) {
    filteredData = null;
    renderTable(data);
    return;
  }

  filteredData = data.filter(row =>
    (row.place || "").toLowerCase().includes(q) ||
    (row.clientName || "").toLowerCase().includes(q) ||
    (row.notes || "").toLowerCase().includes(q)
  );

  renderTable(filteredData);
}

function addRow() {
  if (filteredData) {
    alert("امسح البحث الأول قبل الإضافة");
    return;
  }

  syncTableToData();

  const newRow = {
    clientName: "",
    place: "",
    market: { c20: 0, c40: 0, c2x20: 0 },
    commission: 0,
    client: { c20: 0, c40: 0, c2x20: 0 },
    notes: ""
  };

  data.push(newRow);
  renderTable(data);
}

function deleteRow(index) {
  if (filteredData) {
    alert("امسح البحث الأول قبل الحذف");
    return;
  }

  if (confirm("هل تريد حذف الصف؟")) {
    syncTableToData();
    data.splice(index, 1);
    database.ref("prices").set(data);
  }
}

function saveAll() {
  if (filteredData) {
    alert("امسح البحث الأول قبل الحفظ");
    return;
  }

  syncTableToData();

  database.ref("prices").set(data)
    .then(() => alert("تم الحفظ بنجاح"));
}

function goBack() {
  window.location = "dashboard.html";
}

function logout() {
  firebase.auth().signOut().then(() => {
    window.location = "index.html";
  });
}

loadData();
</script>

</body>
</html>
