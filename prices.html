<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أسعار الحاويات - مكتب الصفا</title>
<style>
body {
  font-family: Arial, sans-serif;
  background:#eef2f7;
  margin:0;
  padding:0;
}
header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#2c3e50;
  color:white;
  padding:10px 20px;
}
header img {
  height:60px;
}
header h2 {
  margin:0;
}
header button {
  padding:8px 15px;
  border:none;
  border-radius:5px;
  background:#e74c3c;
  color:white;
  cursor:pointer;
}
.container {
  max-width:1000px;
  margin:20px auto;
  text-align:center;
}
input {
  padding:12px;
  width:100%;
  border-radius:10px;
  border:1px solid #ccc;
  margin-bottom:15px;
  font-size:16px;
}
table {
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:10px;
  overflow:hidden;
}
th, td {
  border:1px solid #ddd;
  padding:10px;
  text-align:center;
  font-size:14px;
}
tr:nth-child(even){background:#f9f9f9;}
th {
  color:#fff;
}
.header-row {
  background:#3498db;
  color:white;
  font-weight:bold;
}
.market-col { background:#d6eaf8; }
.client-col { background:#f8d7da; }
.edit-btn {
  padding:5px 10px;
  border:none;
  border-radius:5px;
  background:#27ae60;
  color:white;
  cursor:pointer;
}
.edit-btn:disabled { background:#95a5a6; cursor:not-allowed; }
.delete-btn {
  padding:5px 10px;
  border:none;
  border-radius:5px;
  background:#e74c3c;
  color:white;
  cursor:pointer;
}
</style>
</head>
<body>

<header>
  <img src="logo.png" alt="logo">
  <h2>📦 أسعار الحاويات - مكتب الصفا</h2>
  <button onclick="logout()">تسجيل الخروج</button>
</header>

<div class="container">
  <input type="text" id="search" placeholder="اكتب المكان أو العميل..." onkeyup="searchData()">
  <table>
    <thead>
      <tr>
        <th rowspan="2">العميل</th>
        <th rowspan="2">المكان</th>
        <th colspan="3" class="header-row market-col">سعر السوق</th>
        <th rowspan="2">قومسيون</th>
        <th colspan="3" class="header-row client-col">سعر العميل</th>
        <th rowspan="2">حذف</th>
      </tr>
      <tr>
        <th class="market-col">20</th>
        <th class="market-col">40</th>
        <th class="market-col">2×20</th>
        <th class="client-col">20</th>
        <th class="client-col">40</th>
        <th class="client-col">2×20</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <button id="addRowButton">إضافة بيانات جديدة</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyARqSgfh78TqFQ2hhZaAtUaVQFqlPuRM3w",
  authDomain: "trialsafaprices2026.firebaseapp.com",
  databaseURL: "https://trialsafaprices2026-default-rtdb.firebaseio.com",
  projectId: "trialsafaprices2026",
  storageBucket: "trialsafaprices2026.appspot.com",
  messagingSenderId: "177091434445",
  appId: "1:177091434445:web:568b6ae3ba270a21d4d684"
};
firebase.initializeApp(firebaseConfig);
const database = firebase.database();

// حماية الصفحة
firebase.auth().onAuthStateChanged(user => {
  if(!user) window.location.href = "index.html";
});

let data = [];
const commission = 500;

function loadData(){
  database.ref('prices').on('value', snapshot => {
    data = snapshot.val() || [];
    renderTable(data);
  });
}

function renderTable(list){
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  list.forEach((row,index)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td contenteditable="true">${row.clientName||""}</td>
      <td contenteditable="true">${row.place||""}</td>
      <td class="market-col" contenteditable="true">${row.market?.c20||0}</td>
      <td class="market-col" contenteditable="true">${row.market?.c40||0}</td>
      <td class="market-col" contenteditable="true">${row.market?.c2x20||0}</td>
      <td contenteditable="true">${row.commission||commission}</td>
      <td class="client-col" contenteditable="true">${row.client?.c20||0}</td>
      <td class="client-col" contenteditable="true">${row.client?.c40||0}</td>
      <td class="client-col" contenteditable="true">${row.client?.c2x20||0}</td>
      <td><button class="delete-btn" onclick="deleteRow(${index})">❌</button></td>
    `;
    tbody.appendChild(tr);
  });
}

function searchData(){
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = data.filter(row =>
    (row.place||"").toLowerCase().includes(q) ||
    (row.clientName||"").toLowerCase().includes(q)
  );
  renderTable(filtered);
}

function deleteRow(index){
  if(confirm("هل تريد حذف هذا الصف؟")){
    data.splice(index,1);
    database.ref('prices').set(data);
  }
}

document.getElementById('addRowButton').addEventListener('click',()=>{
  const tbody = document.getElementById('tableBody');
  const newRow = {
    clientName:"",
    place:"",
    market:{c20:0,c40:0,c2x20:0},
    commission:commission,
    client:{c20:0,c40:0,c2x20:0}
  };
  data.push(newRow);
  database.ref('prices').set(data);
});

function logout(){
  firebase.auth().signOut().then(()=>{
    window.location.href = "index.html";
  });
}

loadData();
</script>

</body>
</html>
