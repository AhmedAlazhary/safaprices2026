<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Dashboard Button</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; background: #f8f9fa; }
        .btn-login { background: var(--secondary-color, #f59e0b); color: white; padding: 10px 20px; border: none; border-radius: 5px; text-decoration: none; display: inline-block; }
        .btn-login:hover { background: #d97706; color: white; }
        .result { margin: 15px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        h3 { color: #666; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-tachometer-alt"></i> Test Dashboard Button</h1>
        
        <div class="test-section">
            <h3>Step 1: Simulate Login</h3>
            <button onclick="simulateLogin()" class="btn btn-success">Simulate Successful Login</button>
            <button onclick="simulateLogout()" class="btn btn-danger">Simulate Logout</button>
            <div id="login-result"></div>
        </div>

        <div class="test-section">
            <h3>Step 2: Test Dashboard Button</h3>
            <p>The button below should change behavior based on login state:</p>
            
            <!-- This is the exact same button from index.html -->
            <a href="#" class="btn-login login-btn" data-bs-toggle="modal" data-bs-target="#loginModal">
                <i class="fas fa-sign-in-alt"></i> Login
            </a>
            
            <div id="button-result"></div>
        </div>

        <div class="test-section">
            <h3>Step 3: Button Status</h3>
            <div id="status-result"></div>
        </div>

        <div style="margin-top: 30px; text-align: center;">
            <a href="index.html" class="btn btn-primary">Back to Main Page</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyARqSgfh78TqFQ2hhZaAtUaVQFqlPuRM3w",
            authDomain: "trialsafaprices2026.firebaseapp.com",
            projectId: "trialsafaprices2026",
            storageBucket: "trialsafaprices2026.appspot.com",
            messagingSenderId: "177091434445",
            appId: "1:177091434445:web:568b6ae3ba270a21d4d684"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const usersMap = {
            "ahmed": "ahmed@safatrans.com",
            "hesham": "hesham@safatrans.com", 
            "omar": "omar@safatrans.com",
            "sabry": "sabry@safatrans.com"
        };

        function addResult(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}:</strong> ${message}`;
            element.appendChild(div);
        }

        // Update login button based on auth state (exact copy from index.html)
        function updateLoginButton(isLoggedIn) {
            const loginBtn = document.querySelector('.login-btn');
            if (isLoggedIn) {
                loginBtn.innerHTML = '<i class="fas fa-tachometer-alt"></i> Dashboard';
                loginBtn.href = 'dashboard.html';
                loginBtn.removeAttribute('data-bs-toggle');
                loginBtn.removeAttribute('data-bs-target');
                
                // Add click handler for dashboard navigation
                loginBtn.onclick = function(e) {
                    e.preventDefault();
                    console.log('Dashboard button clicked, navigating to dashboard...');
                    addResult('button-result', 'Dashboard button clicked! Attempting navigation...', 'success');
                    
                    // Test navigation
                    setTimeout(() => {
                        addResult('button-result', 'Navigation test successful - would go to dashboard.html', 'success');
                    }, 500);
                };
                
                console.log('Dashboard button configured successfully');
                addResult('status-result', 'Button configured as Dashboard button', 'success');
            } else {
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                loginBtn.href = '#';
                loginBtn.setAttribute('data-bs-toggle', 'modal');
                loginBtn.setAttribute('data-bs-target', '#loginModal');
                
                // Remove dashboard click handler
                loginBtn.onclick = null;
                addResult('status-result', 'Button configured as Login button', 'info');
            }
        }

        window.simulateLogin = async function() {
            const resultDiv = document.getElementById('login-result');
            resultDiv.innerHTML = '';
            
            try {
                addResult('login-result', 'Attempting login with ahmed@safatrans.com...', 'info');
                const userCredential = await signInWithEmailAndPassword(auth, usersMap.ahmed, 'password123');
                
                addResult('login-result', 'Login successful! User: ' + userCredential.user.email, 'success');
                sessionStorage.setItem('userRole', 'admin');
                sessionStorage.setItem('userEmail', userCredential.user.email);
                
                // Update button
                updateLoginButton(true);
                
            } catch (error) {
                addResult('login-result', 'Login failed: ' + error.message, 'error');
            }
        };

        window.simulateLogout = async function() {
            const resultDiv = document.getElementById('login-result');
            resultDiv.innerHTML = '';
            
            try {
                await signOut(auth);
                addResult('login-result', 'Logout successful', 'success');
                sessionStorage.removeItem('userRole');
                sessionStorage.removeItem('userEmail');
                
                // Update button
                updateLoginButton(false);
                
            } catch (error) {
                addResult('login-result', 'Logout failed: ' + error.message, 'error');
            }
        };

        // Check auth state on load
        onAuthStateChanged(auth, (user) => {
            if (user) {
                addResult('login-result', 'User already logged in: ' + user.email, 'success');
                updateLoginButton(true);
            } else {
                addResult('login-result', 'No user logged in', 'info');
                updateLoginButton(false);
            }
        });

        // Make function available globally
        window.updateLoginButton = updateLoginButton;

        console.log('Dashboard button test page loaded');
    </script>
</body>
</html>
