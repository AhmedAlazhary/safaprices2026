<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة المخازن - مكتب الصفا</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
}

header {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
  padding: 1rem 2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
}

header img {
  height: 50px;
}

header h1 {
  color: #2c3e50;
  font-size: 1.8rem;
}

header nav {
  display: flex;
  gap: 1rem;
}

header nav button {
  background: #3498db;
  color: white;
  border: none;
  padding: 0.5rem 1rem;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s ease;
}

header nav button:hover {
  background: #2980b9;
  transform: translateY(-2px);
}

.container {
  max-width: 1400px;
  margin: 2rem auto;
  padding: 0 1rem;
}

.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 1.5rem;
  margin-bottom: 2rem;
}

.card {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  border-radius: 16px;
  padding: 1.5rem;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
  transition: all 0.3s ease;
  border: 1px solid rgba(255, 255, 255, 0.2);
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
}

.card h3 {
  color: #2c3e50;
  font-size: 1.2rem;
}

.card-icon {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
}

.stat-card {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  padding: 1.5rem;
  border-radius: 12px;
  text-align: center;
}

.stat-value {
  font-size: 2rem;
  font-weight: bold;
  margin-bottom: 0.5rem;
}

.stat-label {
  font-size: 0.9rem;
  opacity: 0.9;
}

.quick-actions {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 1rem;
}

.action-btn {
  background: white;
  border: 2px solid #e0e0e0;
  border-radius: 12px;
  padding: 1.5rem;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s ease;
  text-decoration: none;
  color: #2c3e50;
}

.action-btn:hover {
  border-color: #3498db;
  background: #f8f9fa;
  transform: translateY(-2px);
}

.action-btn h4 {
  margin-bottom: 0.5rem;
  color: #2c3e50;
}

.action-btn p {
  color: #7f8c8d;
  font-size: 0.9rem;
}

.recent-activity {
  max-height: 400px;
  overflow-y: auto;
}

.activity-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.75rem;
  border-bottom: 1px solid #ecf0f1;
  transition: background 0.2s ease;
}

.activity-item:hover {
  background: #f8f9fa;
}

.activity-type {
  padding: 0.25rem 0.75rem;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: bold;
}

.type-sale { background: #d4edda; color: #155724; }
.type-purchase { background: #cce5ff; color: #004085; }
.type-transfer { background: #fff3cd; color: #856404; }
.type-adjustment { background: #f8d7da; color: #721c24; }

.loading {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 200px;
}

.spinner {
  border: 4px solid #f3f3f3;
  border-top: 4px solid #3498db;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.alert {
  padding: 1rem;
  border-radius: 8px;
  margin-bottom: 1rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.alert-warning {
  background: #fff3cd;
  border: 1px solid #ffeaa7;
  color: #856404;
}

.alert-danger {
  background: #f8d7da;
  border: 1px solid #f5c6cb;
  color: #721c24;
}

@media (max-width: 768px) {
  header {
    flex-direction: column;
    gap: 1rem;
  }
  
  header h1 {
    font-size: 1.4rem;
  }
  
  .dashboard-grid {
    grid-template-columns: 1fr;
  }
  
  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<header>
  <div style="display: flex; align-items: center; gap: 1rem;">
    <img src="logo.png" alt="شعار مكتب الصفا">
    <h1>نظام إدارة المخازن</h1>
  </div>
  <nav>
    <button onclick="window.location='products-management.html'">الأصناف</button>
    <button onclick="window.location='vehicle-dispense.html'">إذن الصرف</button>
    <button onclick="window.location='stock-balances.html'">الأرصدة</button>
    <button onclick="window.location='stock-movements.html'">الحركات</button>
    <button onclick="window.location='stock-adjustment.html'">الجرد</button>
    <button onclick="window.location='scrap-inventory.html'">مخزون الخردة</button>
    <button onclick="window.location='inventory-reports.html'">التقارير</button>
    <button onclick="goBack()">رجوع</button>
    <button onclick="logout()">تسجيل خروج</button>
  </nav>
</header>

<div class="container">
  <!-- Statistics Cards -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-value" id="totalProducts">0</div>
      <div class="stat-label">إجمالي الأصناف</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="totalWarehouses">0</div>
      <div class="stat-label">عدد المخازن</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="lowStockItems">0</div>
      <div class="stat-label">أصناف ناقصة</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="todayMovements">0</div>
      <div class="stat-label">حركات اليوم</div>
    </div>
  </div>

  <div class="dashboard-grid">
    <!-- Quick Actions -->
    <div class="card">
      <div class="card-header">
        <h3>إجراءات سريعة</h3>
        <div class="card-icon" style="background: #3498db; color: white;">⚡</div>
      </div>
      <div class="quick-actions">
        <h2>إجراءات سريعة</h2>
        <div class="actions-grid">
          <a href="products-management.html" class="action-card">
            <div class="action-icon">+</div>
            <div class="action-text">إضافة صنف</div>
          </a>
          <a href="vehicle-dispense.html" class="action-card">
            <div class="action-icon">+</div>
            <div class="action-text">إذن صرف</div>
          </a>
          <a href="stock-adjustment.html" class="action-card">
            <div class="action-icon">+</div>
            <div class="action-text">جرد مخزون</div>
          </a>
        </div>
        </a>
        <a href="inventory-reports.html" class="action-btn">
          <h4>📈 التقارير</h4>
          <p>تقارير المخزون والصرف</p>
        </a>
      </div>
    </div>

    <!-- Recent Activity -->
    <div class="card">
      <div class="card-header">
        <h3>آخر النشاطات</h3>
        <div class="card-icon" style="background: #e74c3c; color: white;">📋</div>
      </div>
      <div class="recent-activity" id="recentActivity">
        <div class="loading">
          <div class="spinner"></div>
        </div>
      </div>
    </div>

    <!-- Low Stock Alerts -->
    <div class="card">
      <div class="card-header">
        <h3>تنبيهات المخزون</h3>
        <div class="card-icon" style="background: #f39c12; color: white;">⚠️</div>
      </div>
      <div id="lowStockAlerts">
        <div class="loading">
          <div class="spinner"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { auth, db, serverTimestamp } from './firebase-config.js';

// Check authentication
auth.onAuthStateChanged(user => {
  if (!user) {
    window.location = "index.html";
    return;
  }
  
  // Load dashboard data
  loadDashboardData();
});

// Load dashboard statistics and data
async function loadDashboardData() {
  try {
    await Promise.all([
      loadStatistics(),
      loadRecentActivity(),
      loadLowStockAlerts()
    ]);
  } catch (error) {
    console.error('Error loading dashboard:', error);
  }
}

// Load statistics
async function loadStatistics() {
  try {
    const [
      productsSnapshot,
      warehousesSnapshot,
      movementsSnapshot
    ] = await Promise.all([
      db.collection('products').get(),
      db.collection('warehouses').get(),
      db.collection('stock_movements')
        .where('date', '>=', new Date(new Date().setHours(0, 0, 0, 0)))
        .get()
    ]);

    document.getElementById('totalProducts').textContent = productsSnapshot.size;
    document.getElementById('totalWarehouses').textContent = warehousesSnapshot.size;
    document.getElementById('todayMovements').textContent = movementsSnapshot.size;

    // Calculate low stock items
    const lowStockQuery = await db.collection('stock_balances')
      .where('quantity', '<', 10) // This should be dynamic based on minStock
      .get();
    
    document.getElementById('lowStockItems').textContent = lowStockQuery.size;
  } catch (error) {
    console.error('Error loading statistics:', error);
  }
}

// Load recent activity
async function loadRecentActivity() {
  try {
    const movementsSnapshot = await db.collection('stock_movements')
      .orderBy('date', 'desc')
      .limit(10)
      .get();

    const activityContainer = document.getElementById('recentActivity');
    activityContainer.innerHTML = '';

    if (movementsSnapshot.empty) {
      activityContainer.innerHTML = '<p style="text-align: center; color: #7f8c8d;">لا توجد حركات حديثة</p>';
      return;
    }

    movementsSnapshot.forEach(doc => {
      const movement = doc.data();
      const activityItem = document.createElement('div');
      activityItem.className = 'activity-item';
      
      const typeClass = `type-${movement.type}`;
      activityItem.innerHTML = `
        <div>
          <strong>${movement.type === 'sale' ? 'بيع' : movement.type === 'purchase' ? 'شراء' : movement.type === 'transfer' ? 'تحويل' : 'تعديل'}</strong>
          <br>
          <small>${new Date(movement.date.toDate()).toLocaleString('ar-EG')}</small>
        </div>
        <span class="activity-type ${typeClass}">${movement.quantity}</span>
      `;
      
      activityContainer.appendChild(activityItem);
    });
  } catch (error) {
    console.error('Error loading recent activity:', error);
    document.getElementById('recentActivity').innerHTML = '<p style="color: #e74c3c;">خطأ في تحميل النشاطات</p>';
  }
}

// Load low stock alerts
async function loadLowStockAlerts() {
  try {
    const stockSnapshot = await db.collection('stock_balances')
      .where('quantity', '<', 10)
      .limit(5)
      .get();

    const alertsContainer = document.getElementById('lowStockAlerts');
    alertsContainer.innerHTML = '';

    if (stockSnapshot.empty) {
      alertsContainer.innerHTML = '<p style="text-align: center; color: #27ae60;">✅ لا توجد أصناف ناقصة</p>';
      return;
    }

    stockSnapshot.forEach(doc => {
      const stock = doc.data();
      const alert = document.createElement('div');
      alert.className = 'alert alert-warning';
      alert.innerHTML = `
        <span>⚠️ ${stock.productId} - الكمية: ${stock.quantity}</span>
        <button onclick="window.location='stock-balances.html'" style="background: #f39c12; color: white; border: none; padding: 0.25rem 0.5rem; border-radius: 4px; cursor: pointer;">عرض</button>
      `;
      alertsContainer.appendChild(alert);
    });
  } catch (error) {
    console.error('Error loading low stock alerts:', error);
    document.getElementById('lowStockAlerts').innerHTML = '<p style="color: #e74c3c;">خطأ في تحميل التنبيهات</p>';
  }
}

// Navigation functions
function goBack() {
  window.location = "dashboard.html";
}

function logout() {
  auth.signOut().then(() => {
    window.location = "index.html";
  });
}
</script>

</body>
</html>
