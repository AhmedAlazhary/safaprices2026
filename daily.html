<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيان الشغل اليومي - مكتب الصفا</title>

<style>
:root {
  --bg: #edf3f9;
  --surface: #ffffff;
  --surface-soft: #f7fbff;
  --primary: #223547;
  --accent: #2f89d9;
  --accent-soft: #e8f3fe;
  --success: #27ae60;
  --danger: #e74c3c;
  --text: #1f2937;
  --muted: #697586;
  --border: #d6e0eb;
  --shadow: 0 12px 30px rgba(34, 53, 71, 0.08);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  color: var(--text);
  background: linear-gradient(180deg, #f5f8fc 0%, #eaf1f8 100%);
  font-family: "Tahoma", "Segoe UI", Arial, sans-serif;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  padding: 14px 18px;
  color: #fff;
  background: linear-gradient(135deg, #1f3243 0%, #2c3e50 100%);
  box-shadow: 0 8px 24px rgba(20, 31, 44, 0.18);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

header img {
  height: clamp(46px, 7vw, 64px);
  width: auto;
}

header h1 {
  margin: 0;
  font-size: clamp(1.05rem, 2.4vw, 1.5rem);
}

.header-actions,
.toolbar-actions,
.card-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

button {
  border: none;
  border-radius: 10px;
  padding: 10px 14px;
  cursor: pointer;
  font-size: clamp(0.9rem, 1.8vw, 1rem);
  font-weight: 700;
  transition: transform 0.15s ease, opacity 0.15s ease;
}

button:hover {
  transform: translateY(-1px);
}

button:active {
  transform: translateY(0);
}

.ghost-btn {
  background: rgba(255, 255, 255, 0.16);
  color: #fff;
}

.add-btn {
  background: var(--success);
  color: #fff;
}

.save-btn {
  background: var(--accent);
  color: #fff;
}

.delete-btn {
  background: var(--danger);
  color: #fff;
  padding: 8px 12px;
}

.container {
  width: min(1320px, calc(100% - 24px));
  margin: 18px auto 28px;
}

.panel,
.day-card {
  background: var(--surface);
  border-radius: 18px;
  box-shadow: var(--shadow);
}

.panel {
  padding: 18px;
  margin-bottom: 18px;
}

.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.panel-head h2,
.section-title,
.card-title {
  margin: 0;
}

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.toolbar-fields {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: end;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 220px;
}

.field label {
  color: var(--muted);
  font-size: 0.92rem;
  font-weight: 700;
}

.status-line {
  min-height: 22px;
  color: var(--muted);
  font-size: 0.95rem;
}

input {
  width: 100%;
  padding: 9px 10px;
  border-radius: 10px;
  border: 1px solid #ccd8e4;
  background: #fff;
  font-size: 0.95rem;
  text-align: center;
}

input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(47, 137, 217, 0.14);
}

.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--surface-soft);
  -webkit-overflow-scrolling: touch;
}

table {
  width: 100%;
  min-width: 1120px;
  border-collapse: collapse;
  background: #fff;
}

th,
td {
  padding: 10px 8px;
  text-align: center;
  vertical-align: middle;
  border-bottom: 1px solid var(--border);
}

th {
  background: var(--accent);
  color: #fff;
  white-space: nowrap;
  font-size: 0.95rem;
}

tr:last-child td {
  border-bottom: none;
}

.date-cell {
  font-weight: 700;
  color: var(--primary);
  white-space: nowrap;
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.archive-grid {
  display: grid;
  gap: 16px;
}

.day-card {
  padding: 16px;
}

.card-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.card-meta {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.card-date {
  color: var(--muted);
  font-size: 0.92rem;
}

.card-actions {
  align-items: center;
}

.toggle-btn {
  background: #eef5fb;
  color: var(--primary);
}

.day-card.collapsed .table-wrap {
  display: none;
}

.empty-state {
  padding: 22px;
  text-align: center;
  color: var(--muted);
  background: var(--surface);
  border-radius: 16px;
  box-shadow: var(--shadow);
}

.selected-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 0.88rem;
  font-weight: 700;
}

@media (max-width: 768px) {
  .container {
    width: min(100% - 16px, 1000px);
    margin-top: 12px;
  }

  header,
  .panel,
  .day-card {
    padding: 12px;
  }

  .brand,
  .header-actions,
  .toolbar-fields,
  .toolbar-actions {
    width: 100%;
  }

  .header-actions button,
  .toolbar-actions button,
  .card-actions button {
    flex: 1 1 140px;
  }

  .field {
    min-width: 100%;
  }

  input,
  button {
    font-size: 0.92rem;
  }

  .table-wrap {
    overflow-x: auto;
    overflow-y: visible;
    border: 1px solid var(--border);
    background: var(--surface-soft);
  }

  table {
    min-width: 980px;
  }

  th,
  td {
    padding: 8px 6px;
    font-size: 0.84rem;
    white-space: nowrap;
  }

  td::before {
    content: none;
  }

  td input {
    min-width: 90px;
    padding: 8px 6px;
    font-size: 0.84rem;
    text-align: center;
  }

  .date-cell {
    font-size: 0.84rem;
  }

  .delete-btn {
    width: auto;
    min-width: 64px;
    padding: 8px 10px;
  }
}

@media (max-width: 480px) {
  body {
    font-size: 14px;
  }

  .selected-badge {
    width: 100%;
    justify-content: center;
  }

  .panel,
  .day-card {
    border-radius: 14px;
  }

  .card-actions,
  .toolbar-actions {
    gap: 8px;
  }

  td input {
    min-width: 82px;
    font-size: 0.8rem;
    padding: 7px 5px;
  }

  th,
  td {
    font-size: 0.78rem;
    padding: 7px 5px;
  }

  table {
    min-width: 920px;
  }
}
</style>
</head>

<body>
<header>
  <div class="brand">
    <img src="logo.png" alt="شعار مكتب الصفا">
    <h1>بيان الشغل اليومي</h1>
  </div>

  <div class="header-actions">
    <button class="ghost-btn" onclick="goBack()">رجوع</button>
    <button class="ghost-btn" onclick="logout()">تسجيل خروج</button>
  </div>
</header>

<div class="container">
  <section class="panel">
    <div class="panel-head">
      <h2 id="currentDateTitle">بيان اليوم</h2>
      <div id="currentSaveStatus" class="status-line">جارٍ تحميل البيانات...</div>
    </div>

    <div class="toolbar">
      <div class="toolbar-fields">
        <div class="field">
          <label for="datePicker">اختيار التاريخ</label>
          <input type="date" id="datePicker">
        </div>
      </div>

      <div class="toolbar-actions">
        <button class="save-btn" onclick="openSelectedDate()">عرض التاريخ</button>
        <button class="add-btn" onclick="addRow(currentDate)">إضافة سطر للتاريخ الحالي</button>
        <button class="save-btn" onclick="saveDate(currentDate, true)">حفظ التاريخ الحالي</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>التاريخ</th>
            <th>عدد الحاويات</th>
            <th>الحجم</th>
            <th>المكان</th>
            <th>مكان النقلة</th>
            <th>التوكيل</th>
            <th>نوع</th>
            <th>العميل</th>
            <th>ملاحظات</th>
            <th>حذف</th>
          </tr>
        </thead>
        <tbody id="currentTableBody"></tbody>
      </table>
    </div>
  </section>

  <section>
    <div class="section-header">
      <h2 class="section-title">الأرشيف اليومي</h2>
      <div class="selected-badge">يعرض كل يوم في جدول منفصل ويمكن تعديله</div>
    </div>
    <div id="archiveContainer" class="archive-grid"></div>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyARqSgfh78TqFQ2hhZaAtUaVQFqlPuRM3w",
  authDomain: "trialsafaprices2026.firebaseapp.com",
  databaseURL: "https://trialsafaprices2026-default-rtdb.firebaseio.com",
  projectId: "trialsafaprices2026",
  storageBucket: "trialsafaprices2026.appspot.com",
  messagingSenderId: "177091434445",
  appId: "1:177091434445:web:568b6ae3ba270a21d4d684"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();
const today = new Date().toISOString().split("T")[0];
const datePicker = document.getElementById("datePicker");
const currentTableBody = document.getElementById("currentTableBody");
const archiveContainer = document.getElementById("archiveContainer");
const currentDateTitle = document.getElementById("currentDateTitle");
const currentSaveStatus = document.getElementById("currentSaveStatus");

let currentDate = today;
let dailyData = {};
let saveTimers = {};
let savingDates = {};
let collapsedDates = {};

datePicker.value = today;

firebase.auth().onAuthStateChanged(user => {
  if (!user) {
    window.location = "index.html";
  }
});

function getEmptyRow() {
  return {
    containerCount: "",
    size: "",
    place: "",
    move: "",
    agency: "",
    type: "",
    client: "",
    notes: ""
  };
}

function ensureDateRows(date) {
  if (!Array.isArray(dailyData[date]) || !dailyData[date].length) {
    dailyData[date] = [getEmptyRow()];
  }
  return dailyData[date];
}

function getStorageKey(date) {
  return "dailyDraft-" + date;
}

function readDraft(date) {
  const raw = localStorage.getItem(getStorageKey(date));
  if (!raw) return null;

  try {
    return JSON.parse(raw);
  } catch (error) {
    return null;
  }
}

function saveDraft(date) {
  localStorage.setItem(getStorageKey(date), JSON.stringify(ensureDateRows(date)));
}

function setCurrentStatus(message, isError = false) {
  currentSaveStatus.textContent = message;
  currentSaveStatus.style.color = isError ? "#c0392b" : "#697586";
}

function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function formatArabicDate(date) {
  return new Date(date + "T00:00:00").toLocaleDateString("ar-EG", {
    weekday: "long",
    year: "numeric",
    month: "long",
    day: "numeric"
  });
}

function renderRows(rows, date, scope) {
  return rows.map((row, index) => `
    <tr>
      <td class="date-cell" data-label="التاريخ">${date}</td>
      <td data-label="عدد الحاويات"><input type="number" min="0" inputmode="numeric" data-date="${date}" data-index="${index}" data-field="containerCount" data-scope="${scope}" value="${escapeHtml(row.containerCount)}"></td>
      <td data-label="الحجم"><input list="sizes" data-date="${date}" data-index="${index}" data-field="size" data-scope="${scope}" value="${escapeHtml(row.size)}"></td>
      <td data-label="المكان"><input list="places" data-date="${date}" data-index="${index}" data-field="place" data-scope="${scope}" value="${escapeHtml(row.place)}"></td>
      <td data-label="مكان النقلة"><input list="moves" data-date="${date}" data-index="${index}" data-field="move" data-scope="${scope}" value="${escapeHtml(row.move)}"></td>
      <td data-label="التوكيل"><input list="agencies" data-date="${date}" data-index="${index}" data-field="agency" data-scope="${scope}" value="${escapeHtml(row.agency)}"></td>
      <td data-label="نوع"><input list="types" data-date="${date}" data-index="${index}" data-field="type" data-scope="${scope}" value="${escapeHtml(row.type)}"></td>
      <td data-label="العميل"><input list="clients" data-date="${date}" data-index="${index}" data-field="client" data-scope="${scope}" value="${escapeHtml(row.client)}"></td>
      <td data-label="ملاحظات"><input data-date="${date}" data-index="${index}" data-field="notes" data-scope="${scope}" value="${escapeHtml(row.notes)}" placeholder="اكتب ملاحظات"></td>
      <td data-label="حذف"><button class="delete-btn" onclick="deleteRow('${date}', ${index})">حذف</button></td>
    </tr>
  `).join("");
}

function renderCurrentDate() {
  const rows = ensureDateRows(currentDate);
  currentDateTitle.textContent = "بيان التاريخ: " + currentDate;
  currentTableBody.innerHTML = renderRows(rows, currentDate, "current");
}

function getSortedDates() {
  return Object.keys(dailyData).sort((a, b) => b.localeCompare(a));
}

function renderArchive() {
  const dates = getSortedDates().filter(date => date !== currentDate);

  if (!dates.length) {
    archiveContainer.innerHTML = '<div class="empty-state">لا توجد أيام أخرى في الأرشيف حاليًا. بيانات التاريخ المفتوح تظهر في الجدول العلوي.</div>';
    return;
  }

  archiveContainer.innerHTML = dates.map(date => {
    const rows = ensureDateRows(date);
    const isCollapsed = Boolean(collapsedDates[date]);
    return `
      <article class="day-card ${isCollapsed ? "collapsed" : ""}">
        <div class="card-head">
          <div class="card-meta">
            <h3 class="card-title">جدول ${date}</h3>
            <div class="card-date">${formatArabicDate(date)}</div>
          </div>
          <div class="card-actions">
            <button class="toggle-btn" onclick="toggleArchiveDay('${date}')">${isCollapsed ? "فتح اليوم" : "طي اليوم"}</button>
            <button class="save-btn" onclick="focusDate('${date}')">فتح هذا التاريخ</button>
            <button class="add-btn" onclick="addRow('${date}')">إضافة سطر</button>
            <button class="save-btn" onclick="saveDate('${date}', true)">حفظ</button>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>التاريخ</th>
                <th>عدد الحاويات</th>
                <th>الحجم</th>
                <th>المكان</th>
                <th>مكان النقلة</th>
                <th>التوكيل</th>
                <th>نوع</th>
                <th>العميل</th>
                <th>ملاحظات</th>
                <th>حذف</th>
              </tr>
            </thead>
            <tbody>${renderRows(rows, date, "archive")}</tbody>
          </table>
        </div>
      </article>
    `;
  }).join("");
}

function renderAll() {
  renderCurrentDate();
  renderArchive();
}

function toggleArchiveDay(date) {
  collapsedDates[date] = !collapsedDates[date];
  renderArchive();
}

function updateDateRowsFromDom(date) {
  const inputs = document.querySelectorAll(`input[data-date="${date}"][data-field]`);
  const rows = [];

  inputs.forEach(input => {
    const index = Number(input.dataset.index);
    const field = input.dataset.field;

    if (!rows[index]) {
      rows[index] = getEmptyRow();
    }

    rows[index][field] = input.value;
  });

  dailyData[date] = rows.filter(Boolean);

  if (!dailyData[date].length) {
    dailyData[date] = [getEmptyRow()];
  }

  saveDraft(date);
}

function scheduleAutoSave(date) {
  clearTimeout(saveTimers[date]);
  if (date === currentDate) {
    setCurrentStatus("هناك تعديلات لم تُرفع بعد...");
  }
  saveTimers[date] = setTimeout(() => saveDate(date, false), 700);
}

function handleInput(event) {
  const input = event.target;

  if (!input.matches('input[data-date][data-field]')) {
    return;
  }

  const date = input.dataset.date;
  const index = Number(input.dataset.index);
  const field = input.dataset.field;

  ensureDateRows(date);
  if (!dailyData[date][index]) {
    dailyData[date][index] = getEmptyRow();
  }

  dailyData[date][index][field] = input.value;
  saveDraft(date);
  scheduleAutoSave(date);
}

function normalizeSnapshotData(snapshotValue) {
  const normalized = {};
  if (!snapshotValue || typeof snapshotValue !== "object") {
    return normalized;
  }

  Object.keys(snapshotValue).forEach(date => {
    if (Array.isArray(snapshotValue[date]) && snapshotValue[date].length) {
      normalized[date] = snapshotValue[date];
    }
  });

  return normalized;
}

function mergeLocalDrafts() {
  const allDates = new Set([...Object.keys(dailyData), currentDate, today]);

  Object.keys(localStorage).forEach(key => {
    if (key.startsWith("dailyDraft-")) {
      allDates.add(key.replace("dailyDraft-", ""));
    }
  });

  allDates.forEach(date => {
    const draft = readDraft(date);
    if (Array.isArray(draft) && draft.length) {
      dailyData[date] = draft;
    }
  });
}

function loadAllData() {
  db.ref("daily").once("value", snap => {
    dailyData = normalizeSnapshotData(snap.val());
    mergeLocalDrafts();
    initializeCollapsedDates();
    ensureDateRows(currentDate);
    renderAll();
    setCurrentStatus("تم تحميل البيانات ويمكنك التعديل على أي تاريخ.");
  }).catch(() => {
    dailyData = {};
    mergeLocalDrafts();
    initializeCollapsedDates();
    ensureDateRows(currentDate);
    renderAll();
    setCurrentStatus("تعذر تحميل البيانات من الخادم، تم فتح النسخ المحلية المتاحة.", true);
  });
}

function initializeCollapsedDates() {
  const isMobile = window.innerWidth <= 768;
  getSortedDates().forEach(date => {
    if (date !== currentDate && collapsedDates[date] === undefined) {
      collapsedDates[date] = isMobile;
    }
  });
}

function focusDate(date) {
  updateDateRowsFromDom(currentDate);
  currentDate = date;
  datePicker.value = date;
  collapsedDates[date] = false;
  renderAll();
  setCurrentStatus("تم فتح تاريخ " + date);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function openSelectedDate() {
  const selectedDate = datePicker.value || today;
  focusDate(selectedDate);
}

function syncDateFromDom(date) {
  updateDateRowsFromDom(date);
  ensureDateRows(date);
  saveDraft(date);
}

function addRow(date) {
  syncDateFromDom(date);
  dailyData[date].push(getEmptyRow());
  saveDraft(date);
  renderAll();
  scheduleAutoSave(date);

  if (date === currentDate) {
    setCurrentStatus("تمت إضافة سطر جديد والبيانات الحالية محفوظة تلقائيًا.");
  }
}

function deleteRow(date, index) {
  syncDateFromDom(date);
  dailyData[date].splice(index, 1);

  if (!dailyData[date].length) {
    dailyData[date] = [getEmptyRow()];
  }

  saveDraft(date);
  renderAll();
  scheduleAutoSave(date);
}

function saveDate(date, showAlert = false) {
  updateDateRowsFromDom(date);
  clearTimeout(saveTimers[date]);

  if (savingDates[date]) {
    return Promise.resolve();
  }

  savingDates[date] = true;
  if (date === currentDate) {
    setCurrentStatus("جارٍ حفظ بيانات " + date + "...");
  }

  return db.ref("daily/" + date).set(ensureDateRows(date))
    .then(() => {
      saveDraft(date);
      if (date === currentDate) {
        setCurrentStatus("تم الحفظ تلقائيًا في " + new Date().toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" }));
      }
      if (showAlert) {
        alert("تم حفظ بيانات " + date + " بنجاح");
      }
    })
    .catch(() => {
      if (date === currentDate) {
        setCurrentStatus("تعذر الحفظ على الخادم الآن، لكن البيانات محفوظة محليًا.", true);
      }
      if (showAlert) {
        alert("تعذر الحفظ على الخادم الآن، لكن البيانات محفوظة محليًا.");
      }
    })
    .finally(() => {
      savingDates[date] = false;
    });
}

async function saveVisibleDatesBeforeLeave() {
  const dates = getSortedDates();
  for (const date of dates) {
    updateDateRowsFromDom(date);
  }
  await Promise.all(dates.map(date => saveDate(date, false)));
}

async function logout() {
  await saveVisibleDatesBeforeLeave();
  firebase.auth().signOut().then(() => {
    window.location = "index.html";
  });
}

async function goBack() {
  await saveVisibleDatesBeforeLeave();
  window.location = "dashboard.html";
}

document.addEventListener("input", handleInput);

window.addEventListener("beforeunload", () => {
  getSortedDates().forEach(date => {
    updateDateRowsFromDom(date);
    saveDraft(date);
  });
});
