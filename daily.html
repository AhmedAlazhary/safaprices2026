<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيان الشغل اليومي - مكتب الصفا</title>

<style>
:root {
  --bg: #eef2f7;
  --surface: #ffffff;
  --surface-soft: #f8fbff;
  --primary: #2c3e50;
  --accent: #3498db;
  --success: #27ae60;
  --danger: #e74c3c;
  --text: #1f2937;
  --muted: #6b7280;
  --border: #d8e1ea;
  --shadow: 0 10px 30px rgba(44, 62, 80, 0.08);
}

* {
  box-sizing: border-box;
}

body {
  font-family: "Tahoma", "Segoe UI", Arial, sans-serif;
  background: linear-gradient(180deg, #f4f7fb 0%, #eaf1f8 100%);
  margin: 0;
  color: var(--text);
}

header {
  background: linear-gradient(135deg, #233446 0%, #2c3e50 100%);
  color: #fff;
  padding: 14px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  box-shadow: 0 8px 24px rgba(24, 35, 49, 0.18);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

header img {
  height: clamp(48px, 7vw, 64px);
  width: auto;
}

header h3 {
  margin: 0;
  font-size: clamp(1rem, 2.2vw, 1.4rem);
}

.header-actions,
.page-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

button {
  padding: 10px 14px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: clamp(0.9rem, 1.8vw, 1rem);
  font-weight: 700;
  transition: transform 0.15s ease, opacity 0.15s ease;
}

button:hover {
  transform: translateY(-1px);
}

button:active {
  transform: translateY(0);
}

.container {
  width: min(1280px, calc(100% - 24px));
  margin: 18px auto 28px;
}

.panel {
  background: var(--surface);
  border-radius: 18px;
  padding: 18px;
  box-shadow: var(--shadow);
}

.page-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

#todayDate {
  margin: 0;
  font-size: clamp(1rem, 2vw, 1.2rem);
}

.save-status {
  color: var(--muted);
  font-size: 0.95rem;
  min-height: 22px;
}

.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--surface-soft);
}

table {
  width: 100%;
  min-width: 1080px;
  border-collapse: collapse;
  background: #fff;
}

th,
td {
  border-bottom: 1px solid var(--border);
  padding: 10px 8px;
  text-align: center;
  vertical-align: middle;
}

th {
  background: var(--accent);
  color: #fff;
  font-size: 0.95rem;
  white-space: nowrap;
}

tr:last-child td {
  border-bottom: none;
}

input {
  width: 100%;
  padding: 9px 10px;
  border: 1px solid #cfd9e4;
  border-radius: 10px;
  background: #fff;
  font-size: 0.95rem;
  text-align: center;
}

input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15);
}

.date-cell {
  font-weight: 700;
  color: var(--primary);
  white-space: nowrap;
}

.add-btn {
  background: var(--success);
  color: #fff;
}

.save-btn {
  background: #2980b9;
  color: #fff;
}

.delete-btn {
  background: var(--danger);
  color: #fff;
  padding: 8px 12px;
}

@media (max-width: 768px) {
  .container {
    width: min(100% - 16px, 1000px);
    margin-top: 12px;
  }

  .panel {
    padding: 12px;
    border-radius: 14px;
  }

  header {
    padding: 12px;
  }

  .brand,
  .header-actions,
  .page-actions,
  .page-head {
    width: 100%;
  }

  .header-actions button,
  .page-actions button {
    flex: 1 1 140px;
  }

  th,
  td {
    padding: 8px 6px;
  }

  input,
  button {
    font-size: 0.92rem;
  }
}

@media (max-width: 480px) {
  body {
    font-size: 14px;
  }

  header h3 {
    font-size: 1rem;
  }

  input {
    padding: 8px;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <img src="logo.png" alt="شعار مكتب الصفا">
    <h3>بيان الشغل اليومي</h3>
  </div>

  <div class="header-actions">
    <button onclick="goBack()">رجوع</button>
    <button onclick="logout()">تسجيل خروج</button>
  </div>
</header>

<div class="container">
  <div class="panel">
    <div class="page-head">
      <h3 id="todayDate"></h3>
      <div id="saveStatus" class="save-status">جارٍ تحميل البيانات...</div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>التاريخ</th>
            <th>عدد الحاويات</th>
            <th>الحجم</th>
            <th>المكان</th>
            <th>مكان النقلة</th>
            <th>التوكيل</th>
            <th>نوع</th>
            <th>العميل</th>
            <th>ملاحظات</th>
            <th>حذف</th>
          </tr>
        </thead>

        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <br>

    <div class="page-actions">
      <button class="add-btn" onclick="addRow()">إضافة سطر</button>
      <button class="save-btn" onclick="saveData(true)">حفظ اليوم</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyARqSgfh78TqFQ2hhZaAtUaVQFqlPuRM3w",
  authDomain: "trialsafaprices2026.firebaseapp.com",
  databaseURL: "https://trialsafaprices2026-default-rtdb.firebaseio.com",
  projectId: "trialsafaprices2026",
  storageBucket: "trialsafaprices2026.appspot.com",
  messagingSenderId: "177091434445",
  appId: "1:177091434445:web:568b6ae3ba270a21d4d684"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();
const today = new Date().toISOString().split("T")[0];
const storageKey = "dailyDraft-" + today;
const saveStatus = document.getElementById("saveStatus");
let rows = [];
let autoSaveTimer = null;
let isSaving = false;

document.getElementById("todayDate").innerText = "تاريخ اليوم: " + today;

firebase.auth().onAuthStateChanged(user => {
  if (!user) {
    window.location = "index.html";
  }
});

function getEmptyRow() {
  return {
    containerCount: "",
    size: "",
    place: "",
    move: "",
    agency: "",
    type: "",
    client: "",
    notes: ""
  };
}

function setStatus(message, isError = false) {
  saveStatus.textContent = message;
  saveStatus.style.color = isError ? "#c0392b" : "#6b7280";
}

function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function persistDraftLocal() {
  localStorage.setItem(storageKey, JSON.stringify(rows));
}

function readDraftLocal() {
  const raw = localStorage.getItem(storageKey);
  if (!raw) return null;

  try {
    return JSON.parse(raw);
  } catch (error) {
    return null;
  }
}

function render() {
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";

  if (!rows.length) {
    rows = [getEmptyRow()];
  }

  rows.forEach((row, index) => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td class="date-cell">${today}</td>
      <td><input type="number" min="0" inputmode="numeric" data-index="${index}" data-field="containerCount" value="${escapeHtml(row.containerCount)}"></td>
      <td><input list="sizes" data-index="${index}" data-field="size" value="${escapeHtml(row.size)}"></td>
      <td><input list="places" data-index="${index}" data-field="place" value="${escapeHtml(row.place)}"></td>
      <td><input list="moves" data-index="${index}" data-field="move" value="${escapeHtml(row.move)}"></td>
      <td><input list="agencies" data-index="${index}" data-field="agency" value="${escapeHtml(row.agency)}"></td>
      <td><input list="types" data-index="${index}" data-field="type" value="${escapeHtml(row.type)}"></td>
      <td><input list="clients" data-index="${index}" data-field="client" value="${escapeHtml(row.client)}"></td>
      <td><input data-index="${index}" data-field="notes" value="${escapeHtml(row.notes)}" placeholder="اكتب ملاحظات"></td>
      <td><button class="delete-btn" onclick="deleteRow(${index})">حذف</button></td>
    `;

    tbody.appendChild(tr);
  });
}

function updateRowsFromDom() {
  const inputs = document.querySelectorAll("#tableBody input");

  inputs.forEach(input => {
    const rowIndex = Number(input.dataset.index);
    const field = input.dataset.field;

    if (!rows[rowIndex]) {
      rows[rowIndex] = getEmptyRow();
    }

    rows[rowIndex][field] = input.value;
  });

  persistDraftLocal();
}

function scheduleAutoSave() {
  clearTimeout(autoSaveTimer);
  setStatus("هناك تعديلات لم تُرفع بعد...");
  autoSaveTimer = setTimeout(() => saveData(false), 700);
}

function handleInput(event) {
  const input = event.target;

  if (!input.matches("#tableBody input")) {
    return;
  }

  const rowIndex = Number(input.dataset.index);
  const field = input.dataset.field;

  if (!rows[rowIndex]) {
    rows[rowIndex] = getEmptyRow();
  }

  rows[rowIndex][field] = input.value;
  persistDraftLocal();
  scheduleAutoSave();
}

function loadData() {
  const localDraft = readDraftLocal();

  db.ref("daily/" + today).once("value", snap => {
    const remoteRows = snap.val();

    if (Array.isArray(localDraft) && localDraft.length) {
      rows = localDraft;
      setStatus("تم استرجاع آخر تعديلات محفوظة تلقائيًا.");
    } else if (Array.isArray(remoteRows) && remoteRows.length) {
      rows = remoteRows;
      setStatus("تم تحميل بيانات اليوم.");
    } else {
      rows = [getEmptyRow()];
      setStatus("ابدأ بإضافة بيانات اليوم.");
    }

    render();
  }).catch(() => {
    rows = Array.isArray(localDraft) && localDraft.length ? localDraft : [getEmptyRow()];
    render();
    setStatus("تعذر تحميل البيانات من الخادم، تم فتح آخر نسخة محلية.", true);
  });
}

function addRow() {
  updateRowsFromDom();
  saveData(false);
  rows.push(getEmptyRow());
  persistDraftLocal();
  render();
  setStatus("تمت إضافة سطر جديد وحفظ التعديلات الحالية.");
}

function deleteRow(index) {
  updateRowsFromDom();
  rows.splice(index, 1);

  if (!rows.length) {
    rows = [getEmptyRow()];
  }

  persistDraftLocal();
  render();
  saveData(false);
}

function saveData(showAlert = true) {
  updateRowsFromDom();
  clearTimeout(autoSaveTimer);

  if (isSaving) {
    return Promise.resolve();
  }

  isSaving = true;
  setStatus("جارٍ الحفظ...");

  return db.ref("daily/" + today).set(rows)
    .then(() => {
      persistDraftLocal();
      setStatus("تم الحفظ تلقائيًا في " + new Date().toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" }));
      if (showAlert) {
        alert("تم حفظ اليوم بنجاح");
      }
    })
    .catch(() => {
      setStatus("تعذر رفع التعديلات الآن، لكن تم الاحتفاظ بها على هذا الجهاز.", true);
      if (showAlert) {
        alert("تعذر الحفظ على الخادم الآن، لكن البيانات محفوظة محليًا.");
      }
    })
    .finally(() => {
      isSaving = false;
    });
}

async function logout() {
  await saveData(false);
  firebase.auth().signOut().then(() => {
    window.location = "index.html";
  });
}

async function goBack() {
  await saveData(false);
  window.location = "dashboard.html";
}

document.getElementById("tableBody").addEventListener("input", handleInput);

window.addEventListener("beforeunload", () => {
  updateRowsFromDom();
  persistDraftLocal();
});

loadData();
</script>

<datalist id="sizes">
  <option value="20">
  <option value="40">
  <option value="2*20">
</datalist>

<datalist id="places">
  <option value="الإسكندرية">
  <option value="الدخيلة">
</datalist>

<datalist id="moves">
  <option value="15مايو">
  <option value="ابو المطامير">
  <option value="ابو رواش">
  <option value="اكتوبر">
  <option value="العاشر">
  <option value="السادات">
</datalist>

<datalist id="agencies">
  <option value="CMA">
  <option value="MSC">
  <option value="MESCO">
  <option value="بان مارين">
  <option value="MAERSK">
</datalist>

<datalist id="types">
  <option value="صادر">
  <option value="وارد">
</datalist>

<datalist id="clients">
  <option value="النساجون">
  <option value="موفت">
  <option value="هيثم">
  <option value="سحر">
  <option value="شيماء">
  <option value="مروة">
</datalist>

</body>
</html>
