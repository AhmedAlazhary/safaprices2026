<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيان الشغل اليومي - مكتب الصفا</title>

<style>
body {
  font-family: Arial;
  background:#eef2f7;
  margin:0;
}

header {
  background:#2c3e50;
  color:#fff;
  padding:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header img {
  height:60px;
}

button {
  padding:8px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.container {
  max-width:1100px;
  margin:20px auto;
}

table {
  width:100%;
  border-collapse:collapse;
  background:#fff;
}

th, td {
  border:1px solid #ddd;
  padding:8px;
  text-align:center;
}

th {
  background:#3498db;
  color:#fff;
}

select, input {
  width:100%;
  padding:5px;
}

.add-btn {
  background:#27ae60;
  color:#fff;
}

.save-btn {
  background:#2980b9;
  color:#fff;
}

.delete-btn {
  background:#e74c3c;
  color:#fff;
}
</style>
</head>

<body>

<header>
  <img src="logo.png">
  <h3>📋 بيان الشغل اليومي</h3>
  <div>
    <button onclick="goBack()">رجوع</button>
    <button onclick="logout()">تسجيل خروج</button>
  </div>
</header>

<div class="container">

<h3 id="todayDate"></h3>

<table>
<thead>
<tr>
<th>التاريخ</th>
<th>الحجم</th>
<th>المكان</th>
<th>مكان النقلة</th>
<th>التوكيل</th>
<th>نوع</th>
<th>العميل</th>
<th>حذف</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>

<br>
<button class="add-btn" onclick="addRow()">➕ إضافة سطر</button>
<button class="save-btn" onclick="saveData()">💾 حفظ اليوم</button>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyARqSgfh78TqFQ2hhZaAtUaVQFqlPuRM3w",
  authDomain: "trialsafaprices2026.firebaseapp.com",
  databaseURL: "https://trialsafaprices2026-default-rtdb.firebaseio.com",
  projectId: "trialsafaprices2026",
  storageBucket: "trialsafaprices2026.appspot.com",
  messagingSenderId: "177091434445",
  appId: "1:177091434445:web:568b6ae3ba270a21d4d684"
};
firebase.initializeApp(firebaseConfig);

const db = firebase.database();

// حماية
firebase.auth().onAuthStateChanged(user=>{
  if(!user) window.location="index.html";
});

// التاريخ
const today = new Date().toISOString().split("T")[0];
document.getElementById("todayDate").innerText = "تاريخ اليوم: " + today;

// قوائم
let sizes = ["20","40","2*20"];
let places = ["الإسكندرية","الدخيلة"];
let moves = ["15مايو","ابو المطامير","ابو رواش","اكتوبر","العاشر","السادات"];
let agencies = ["CMA","MSC","MESCO","بان مارين","MAERSK"];
let types = ["صادر","وارد"];
let clients = ["النساجون","موفت","هيثم","سحر","شيماء","مروة"];

let rows = [];

// تحميل
function loadData(){
  db.ref("daily/"+today).once("value",snap=>{
    rows = snap.val() || [];
    render();
  });
}

function render(){
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";

  rows.forEach((r,i)=>{
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${today}</td>

      <td>
        <input list="sizes" value="${r.size||""}">
      </td>

      <td>
        <input list="places" value="${r.place||""}">
      </td>

      <td>
        <input list="moves" value="${r.move||""}">
      </td>

      <td>
        <input list="agencies" value="${r.agency||""}">
      </td>

      <td>
        <input list="types" value="${r.type||""}">
      </td>

      <td>
        <input list="clients" value="${r.client||""}">
      </td>

      <td>
        <button class="delete-btn" onclick="deleteRow(${i})">❌</button>
      </td>
    `;

    tbody.appendChild(tr);
  });
}

// إضافة
function addRow(){
  rows.push({});
  render();
}

// حذف
function deleteRow(i){
  rows.splice(i,1);
  render();
}

// حفظ
function saveData(){
  const trs = document.querySelectorAll("#tableBody tr");

  rows = Array.from(trs).map(tr=>{
    const inputs = tr.querySelectorAll("input");
    return {
      size: inputs[0].value,
      place: inputs[1].value,
      move: inputs[2].value,
      agency: inputs[3].value,
      type: inputs[4].value,
      client: inputs[5].value
    };
  });

  db.ref("daily/"+today).set(rows)
  .then(()=> alert("تم حفظ اليوم ✅"));
}

// خروج
function logout(){
  firebase.auth().signOut().then(()=>{
    window.location="index.html";
  });
}

// رجوع
function goBack(){
  window.location="dashboard.html";
}

loadData();
</script>

<!-- datalist -->
<datalist id="sizes">
  <option value="20">
  <option value="40">
  <option value="2*20">
</datalist>

<datalist id="places">
  <option value="الإسكندرية">
  <option value="الدخيلة">
</datalist>

<datalist id="moves">
  <option value="15مايو">
  <option value="ابو المطامير">
  <option value="ابو رواش">
  <option value="اكتوبر">
  <option value="العاشر">
  <option value="السادات">
</datalist>

<datalist id="agencies">
  <option value="CMA">
  <option value="MSC">
  <option value="MESCO">
  <option value="بان مارين">
  <option value="MAERSK">
</datalist>

<datalist id="types">
  <option value="صادر">
  <option value="وارد">
</datalist>

<datalist id="clients">
  <option value="النساجون">
  <option value="موفت">
  <option value="هيثم">
  <option value="سحر">
  <option value="شيماء">
  <option value="مروة">
</datalist>

</body>
</html>
