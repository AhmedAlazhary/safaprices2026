<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Simple Inventory - Office Safa</title>
<style>
:root {
  --bg: #eef3f8;
  --surface: #ffffff;
  --primary: #1f3347;
  --accent: #2f89d9;
  --success: #27ae60;
  --warning: #d97706;
  --danger: #e74c3c;
  --text: #152434;
  --muted: #667789;
  --border: #d5e1ec;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Tahoma", "Segoe UI", Arial, sans-serif;
  background: linear-gradient(180deg, #f7fafe 0%, var(--bg) 100%);
  color: var(--text);
}

header {
  padding: 18px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  color: #fff;
  background: linear-gradient(135deg, #1a2b3b 0%, #2c3e50 100%);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand img {
  height: 56px;
}

.brand h1 {
  margin: 0;
  font-size: clamp(1.1rem, 2.4vw, 1.55rem);
}

.container {
  width: min(1240px, calc(100% - 24px));
  margin: 18px auto 28px;
}

.panel {
  background: var(--surface);
  border-radius: 22px;
  box-shadow: 0 18px 40px rgba(31, 51, 71, 0.12);
  padding: 22px;
}

.panel h2 {
  margin: 0 0 18px;
  color: var(--primary);
}

button {
  border: none;
  border-radius: 12px;
  padding: 11px 16px;
  cursor: pointer;
  font-size: 0.98rem;
  font-weight: 700;
  transition: transform 0.15s ease;
  margin: 5px;
}

button:hover {
  transform: translateY(-1px);
}

.primary-btn {
  background: var(--accent);
  color: white;
}

.success-btn {
  background: var(--success);
  color: white;
}

.danger-btn {
  background: var(--danger);
  color: white;
}

.ghost-btn {
  background: rgba(255, 255, 255, 0.16);
  color: #fff;
}

.table-container {
  overflow-x: auto;
  border-radius: 12px;
  border: 1px solid var(--border);
}

table {
  width: 100%;
  border-collapse: collapse;
  background: var(--surface);
}

th {
  background: #f7fbff;
  padding: 12px;
  text-align: right;
  font-weight: 700;
  color: var(--primary);
  border-bottom: 2px solid var(--border);
}

td {
  padding: 12px;
  border-bottom: 1px solid var(--border);
}

tr:hover {
  background: #f7fbff;
}

.alert {
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 16px;
  font-weight: 700;
}

.alert-success {
  background: rgba(39, 174, 96, 0.1);
  color: var(--success);
  border: 1px solid rgba(39, 174, 96, 0.3);
}

.alert-danger {
  background: rgba(231, 76, 60, 0.1);
  color: var(--danger);
  border: 1px solid rgba(231, 76, 60, 0.3);
}

.alert-info {
  background: rgba(47, 137, 217, 0.1);
  color: var(--accent);
  border: 1px solid rgba(47, 137, 217, 0.3);
}

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  margin-bottom: 6px;
  font-weight: 700;
  color: var(--text);
}

.form-group input, .form-group select {
  width: 100%;
  padding: 12px;
  border: 2px solid var(--border);
  border-radius: 8px;
  font-size: 0.98rem;
}

.form-group input:focus, .form-group select:focus {
  outline: none;
  border-color: var(--accent);
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}

.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.5);
}

.modal-content {
  background-color: var(--surface);
  margin: 5% auto;
  padding: 24px;
  border-radius: 16px;
  width: min(600px, 90%);
  max-height: 80vh;
  overflow-y: auto;
}

.close-btn {
  color: var(--muted);
  float: right;
  font-size: 28px;
  font-weight: bold;
  cursor: pointer;
}

.close-btn:hover {
  color: var(--text);
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="logo.png" alt="logo">
    <h1>Test Simple Inventory System</h1>
  </div>
  <div class="header-actions">
    <button class="ghost-btn" onclick="window.location='dashboard.html'">Back to Dashboard</button>
    <button class="ghost-btn" onclick="window.location='index.html'">Logout</button>
  </div>
</header>

<div class="container">
  <div class="panel">
    <h2>Simple Inventory Test</h2>
    
    <div id="alerts"></div>
    
    <div style="display: flex; gap: 12px; margin-bottom: 20px;">
      <button class="primary-btn" onclick="testFirebaseConnection()">Test Firebase Connection</button>
      <button class="success-btn" onclick="testAddItem()">Add Test Item</button>
      <button class="danger-btn" onclick="testClearItems()">Clear All Items</button>
      <button class="primary-btn" onclick="loadItems()">Load Items</button>
    </div>
    
    <div class="table-container">
      <table id="itemsTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Category</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="itemsTableBody">
          <tr>
            <td colspan="6" style="text-align: center; padding: 40px;">
              Click "Test Firebase Connection" to start
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Add Item Modal -->
<div id="addItemModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <h2>Add New Item</h2>
    <form id="addItemForm">
      <div class="form-grid">
        <div class="form-group">
          <label>Name *</label>
          <input type="text" id="itemName" required>
        </div>
        <div class="form-group">
          <label>Category *</label>
          <select id="itemCategory" required>
            <option value="">Select Category</option>
            <option value="Test">Test</option>
            <option value="Sample">Sample</option>
          </select>
        </div>
        <div class="form-group">
          <label>Quantity *</label>
          <input type="number" id="itemQuantity" min="0" required>
        </div>
        <div class="form-group">
          <label>Price *</label>
          <input type="number" id="itemPrice" min="0" step="0.01" required>
        </div>
      </div>
      <div style="display: flex; gap: 12px; justify-content: center;">
        <button type="button" class="ghost-btn" onclick="closeModal()">Cancel</button>
        <button type="submit" class="primary-btn">Save Item</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { 
  getFirestore, 
  collection, 
  doc, 
  getDoc, 
  getDocs, 
  addDoc, 
  updateDoc, 
  deleteDoc, 
  serverTimestamp 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyARqSgfh78TqFQ2hhZaAtUaVQFqlPuRM3w",
  authDomain: "trialsafaprices2026.firebaseapp.com",
  projectId: "trialsafaprices2026",
  storageBucket: "trialsafaprices2026.appspot.com",
  messagingSenderId: "177091434445",
  appId: "1:177091434445:web:568b6ae3ba270a21d4d684"
};

console.log('Initializing Firebase...');
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Global variables
let currentUser = null;

// Check authentication
onAuthStateChanged(auth, user => {
  console.log('Auth state changed:', user);
  if (!user) {
    showAlert('Please login first', 'danger');
    setTimeout(() => {
      window.location.href = "index.html";
    }, 2000);
    return;
  }
  currentUser = user;
  showAlert(`Logged in as: ${user.email}`, 'success');
});

// Show alert function
function showAlert(message, type) {
  const alertsContainer = document.getElementById('alerts');
  const alert = document.createElement('div');
  alert.className = `alert alert-${type}`;
  alert.textContent = message;
  alertsContainer.appendChild(alert);
  
  setTimeout(() => {
    alert.remove();
  }, 5000);
}

// Test Firebase connection
async function testFirebaseConnection() {
  try {
    showAlert('Testing Firebase connection...', 'info');
    
    // Test basic connection
    const testDoc = doc(db, 'test', 'connection');
    await setDoc(testDoc, {
      test: true,
      timestamp: serverTimestamp()
    });
    
    showAlert('Firebase connection successful!', 'success');
    
    // Clean up test doc
    await deleteDoc(testDoc);
    
  } catch (error) {
    console.error('Firebase connection error:', error);
    showAlert('Firebase connection failed: ' + error.message, 'danger');
  }
}

// Load items
async function loadItems() {
  try {
    showAlert('Loading items...', 'info');
    
    const querySnapshot = await getDocs(collection(db, 'Items'));
    const items = [];
    
    querySnapshot.forEach((doc) => {
      items.push({ id: doc.id, ...doc.data() });
    });
    
    console.log('Loaded items:', items);
    displayItems(items);
    
    if (items.length === 0) {
      showAlert('No items found. Add some test items.', 'info');
    } else {
      showAlert(`Loaded ${items.length} items`, 'success');
    }
    
  } catch (error) {
    console.error('Error loading items:', error);
    showAlert('Error loading items: ' + error.message, 'danger');
  }
}

// Display items
function displayItems(items) {
  const tbody = document.getElementById('itemsTableBody');
  
  if (items.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px;">No items found</td></tr>';
    return;
  }
  
  tbody.innerHTML = items.map(item => `
    <tr>
      <td>${item.name || 'N/A'}</td>
      <td>${item.categoryId || 'N/A'}</td>
      <td>${item.quantity || 0}</td>
      <td>${item.unitPrice ? item.unitPrice.toFixed(2) : '0.00'}</td>
      <td>${item.status || 'N/A'}</td>
      <td>
        <button class="danger-btn" onclick="deleteItem('${item.id}')">Delete</button>
      </td>
    </tr>
  `).join('');
}

// Test add item
function testAddItem() {
  document.getElementById('addItemModal').style.display = 'block';
}

// Add item form submission
document.getElementById('addItemForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  try {
    const itemData = {
      name: document.getElementById('itemName').value,
      categoryId: document.getElementById('itemCategory').value,
      quantity: parseInt(document.getElementById('itemQuantity').value),
      unitPrice: parseFloat(document.getElementById('itemPrice').value),
      status: 'test',
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    };
    
    showAlert('Adding item...', 'info');
    
    await addDoc(collection(db, 'Items'), itemData);
    
    showAlert('Item added successfully!', 'success');
    closeModal();
    loadItems();
    
  } catch (error) {
    console.error('Error adding item:', error);
    showAlert('Error adding item: ' + error.message, 'danger');
  }
});

// Delete item
async function deleteItem(itemId) {
  if (!confirm('Are you sure you want to delete this item?')) {
    return;
  }
  
  try {
    showAlert('Deleting item...', 'info');
    await deleteDoc(doc(db, 'Items', itemId));
    showAlert('Item deleted successfully!', 'success');
    loadItems();
  } catch (error) {
    console.error('Error deleting item:', error);
    showAlert('Error deleting item: ' + error.message, 'danger');
  }
}

// Clear all items
async function testClearItems() {
  if (!confirm('Are you sure you want to delete ALL items? This cannot be undone.')) {
    return;
  }
  
  try {
    showAlert('Clearing all items...', 'info');
    
    const querySnapshot = await getDocs(collection(db, 'Items'));
    const deletePromises = [];
    
    querySnapshot.forEach((doc) => {
      deletePromises.push(deleteDoc(doc.ref));
    });
    
    await Promise.all(deletePromises);
    
    showAlert(`Deleted ${deletePromises.length} items`, 'success');
    loadItems();
    
  } catch (error) {
    console.error('Error clearing items:', error);
    showAlert('Error clearing items: ' + error.message, 'danger');
  }
}

// Modal functions
function closeModal() {
  document.getElementById('addItemModal').style.display = 'none';
  document.getElementById('addItemForm').reset();
}

// Make functions global
window.testFirebaseConnection = testFirebaseConnection;
window.testAddItem = testAddItem;
window.testClearItems = testClearItems;
window.loadItems = loadItems;
window.deleteItem = deleteItem;
window.closeModal = closeModal;

// Auto-load on page load
setTimeout(() => {
  if (currentUser) {
    loadItems();
  }
}, 1000);
</script>
</body>
</html>
