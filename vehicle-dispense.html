<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> issuing warehouse - garage system</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
}

header {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
  padding: 1rem 2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
}

header img {
  height: 50px;
}

header h1 {
  color: #2c3e50;
  font-size: 1.8rem;
}

header nav {
  display: flex;
  gap: 1rem;
}

header nav button {
  background: #3498db;
  color: white;
  border: none;
  padding: 0.5rem 1rem;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s ease;
}

header nav button:hover {
  background: #2980b9;
  transform: translateY(-2px);
}

.container {
  max-width: 1400px;
  margin: 2rem auto;
  padding: 0 1rem;
}

.main-content {
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: 2rem;
}

.card {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  border-radius: 16px;
  padding: 1.5rem;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
}

.card h2 {
  color: #2c3e50;
  margin-bottom: 1.5rem;
  font-size: 1.4rem;
}

.form-group {
  margin-bottom: 1.5rem;
}

.form-group label {
  display: block;
  margin-bottom: 0.5rem;
  color: #2c3e50;
  font-weight: 500;
}

.form-group input,
.form-group select {
  width: 100%;
  padding: 0.75rem;
  border: 2px solid #e0e0e0;
  border-radius: 8px;
  font-size: 1rem;
  transition: border-color 0.3s ease;
}

.form-group input:focus,
.form-group select:focus {
  outline: none;
  border-color: #3498db;
}

.dispense-items {
  margin-top: 1.5rem;
}

.item-row {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr auto;
  gap: 0.5rem;
  margin-bottom: 0.5rem;
  align-items: center;
}

.item-row input,
.item-row select {
  padding: 0.5rem;
  border: 2px solid #e0e0e0;
  border-radius: 6px;
  font-size: 0.9rem;
}

.btn {
  padding: 0.75rem 1.5rem;
  border: none;
  border-radius: 8px;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.3s ease;
  font-weight: 500;
}

.btn-primary {
  background: #3498db;
  color: white;
}

.btn-primary:hover {
  background: #2980b9;
  transform: translateY(-2px);
}

.btn-success {
  background: #27ae60;
  color: white;
}

.btn-success:hover {
  background: #229954;
  transform: translateY(-2px);
}

.btn-danger {
  background: #e74c3c;
  color: white;
}

.btn-danger:hover {
  background: #c0392b;
  transform: translateY(-2px);
}

.btn-secondary {
  background: #95a5a6;
  color: white;
}

.btn-secondary:hover {
  background: #7f8c8d;
  transform: translateY(-2px);
}

.btn-warning {
  background: #f39c12;
  color: white;
}

.btn-warning:hover {
  background: #e67e22;
  transform: translateY(-2px);
}

.dispense-summary {
  background: #f8f9fa;
  padding: 1.5rem;
  border-radius: 12px;
  margin-top: 1rem;
}

.summary-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 0.5rem;
  font-size: 1.1rem;
}

.summary-row.total {
  font-weight: bold;
  font-size: 1.3rem;
  color: #2c3e50;
  border-top: 2px solid #3498db;
  padding-top: 0.5rem;
  margin-top: 0.5rem;
}

.recent-dispenses {
  max-height: 400px;
  overflow-y: auto;
}

.dispense-item {
  background: #f8f9fa;
  padding: 1rem;
  border-radius: 8px;
  margin-bottom: 0.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: background 0.2s ease;
}

.dispense-item:hover {
  background: #e9ecef;
}

.dispense-info {
  flex: 1;
}

.dispense-id {
  font-weight: bold;
  color: #2c3e50;
}

.dispense-date {
  font-size: 0.9rem;
  color: #7f8c8d;
}

.dispense-total {
  font-weight: bold;
  color: #27ae60;
}

.alert {
  padding: 1rem;
  border-radius: 8px;
  margin-bottom: 1rem;
}

.alert-success {
  background: #d4edda;
  border: 1px solid #c3e6cb;
  color: #155724;
}

.alert-error {
  background: #f8d7da;
  border: 1px solid #f5c6cb;
  color: #721c24;
}

.alert-warning {
  background: #fff3cd;
  border: 1px solid #ffeaa7;
  color: #856404;
}

.loading {
  text-align: center;
  padding: 2rem;
}

.spinner {
  border: 4px solid #f3f3f3;
  border-top: 4px solid #3498db;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  animation: spin 1s linear infinite;
  margin: 0 auto;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@media (max-width: 1024px) {
  .main-content {
    grid-template-columns: 1fr;
  }
  
  .item-row {
    grid-template-columns: 1fr;
    gap: 0.25rem;
  }
}

@media (max-width: 768px) {
  header {
    flex-direction: column;
    gap: 1rem;
  }
}
</style>
</head>

<body>

<header>
  <div style="display: flex; align-items: center; gap: 1rem;">
    <img src="logo.png" alt="Safa Office Logo">
    <h1>Warehouse Issue Order</h1>
  </div>
  <nav>
    <button onclick="window.location='inventory-management.html'">الرئيسية</button>
    <button onclick="goBack()">رجوع</button>
    <button onclick="logout()">تسجيل خروج</button>
  </nav>
</header>

<div class="container">
  <div class="main-content">
    <!-- Issue Order Form -->
    <div class="card">
      <h2>Create Issue Order</h2>
      <form id="dispenseForm">
        <div class="form-group">
          <label for="vehicleNumber">Vehicle Number *</label>
          <select id="vehicleNumber" required>
            <option value="">Choose Vehicle</option>
            <option value="CAR001">CAR 001</option>
            <option value="CAR002">CAR 002</option>
            <option value="CAR003">CAR 003</option>
            <option value="CAR004">CAR 004</option>
            <option value="CAR005">CAR 005</option>
            <option value="CAR006">CAR 006</option>
            <option value="CAR007">CAR 007</option>
            <option value="CAR008">CAR 008</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="driverName">Driver Name *</label>
          <input type="text" id="driverName" required placeholder="Enter driver name">
        </div>
        
        <div class="form-group">
          <label for="warehouse">Warehouse *</label>
          <select id="warehouse" required>
            <option value="">Choose Warehouse</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="dispenseDate">Date</label>
          <input type="date" id="dispenseDate" required>
        </div>
        
        <!-- Issue Items -->
        <div class="dispense-items">
          <h3>Parts</h3>
          <div id="itemsContainer">
            <div class="item-row">
              <select class="product-select" onchange="updateProductDetails(this)">
                <option value="">Choose Part</option>
              </select>
              <input type="number" class="quantity" placeholder="Quantity" min="1" onchange="calculateItemTotal(this)">
              <input type="number" class="price" placeholder="Cost" step="0.01" min="0" onchange="calculateItemTotal(this)">
              <input type="number" class="total" placeholder="Total" readonly>
              <button type="button" class="btn btn-danger" onclick="removeItem(this)">×</button>
            </div>
          </div>
          
          <button type="button" class="btn btn-secondary" onclick="addNewItem()">+ إضافة قطعة</button>
          <button type="button" class="btn btn-warning" onclick="collectScrap()">+ استلام تالف</button>
        </div>
        
        <!-- Issue Summary -->
        <div class="dispense-summary">
          <div class="summary-row">
            <span>Subtotal:</span>
            <span id="subtotal">0.00</span>
          </div>
          <div class="summary-row total">
            <span>Total:</span>
            <span id="total">0.00</span>
          </div>
        </div>
        
        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
          <button type="submit" class="btn btn-success">حفظ إذن الصرف</button>
          <button type="button" class="btn btn-secondary" onclick="resetForm()">إعادة تعيين</button>
        </div>
      </form>
    </div>
    
    <!-- Recent Issues -->
    <div class="card">
      <h2>Recent Issues</h2>
      <div class="recent-dispenses" id="recentDispenses">
        <div class="loading">
          <div class="spinner"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Scrap Collection Modal -->
<div id="scrapModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 1000; justify-content: center; align-items: center;">
  <div class="modal-content" style="background: white; padding: 2rem; border-radius: 16px; max-width: 500px; width: 90%;">
    <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
      <h3 style="color: #2c3e50;">Receive Scrap Parts</h3>
      <button class="close-btn" onclick="closeScrapModal()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #7f8c8d;">&times;</button>
    </div>
    <form id="scrapForm">
      <div class="form-group">
        <label for="scrapPartName">Part Name *</label>
        <input type="text" id="scrapPartName" required placeholder="Enter scrap part name">
      </div>
      
      <div class="form-group">
        <label for="scrapQuantity">Quantity *</label>
        <input type="number" id="scrapQuantity" required min="1" placeholder="Enter quantity">
      </div>
      
      <div class="form-group">
        <label for="scrapCondition">Condition</label>
        <select id="scrapCondition">
          <option value="good">Good</option>
          <option value="fair">Fair</option>
          <option value="poor">Poor</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="scrapNotes">Notes</label>
        <textarea id="scrapNotes" rows="3" style="width: 100%; padding: 0.75rem; border: 2px solid #e0e0e0; border-radius: 8px; resize: vertical;"></textarea>
      </div>
      
      <div style="display: flex; gap: 1rem; justify-content: flex-end;">
        <button type="button" class="btn btn-secondary" onclick="closeScrapModal()">إلغاء</button>
        <button type="submit" class="btn btn-warning">استلام تالف</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
import { auth, db, serverTimestamp, runTransaction, collection, doc, addDoc, updateDoc, deleteDoc, getDocs, getDoc, query, orderBy, where, limit, setDoc } from './firebase-config.js';

// Check authentication
auth.onAuthStateChanged(user => {
  if (!user) {
    window.location = "index.html";
    return;
  }
  
  // Initialize form
  initializeForm();
  loadRecentDispenses();
});

// Global variables
let products = [];
let warehouses = [];
let currentDispenseType = 'issue';

// Initialize form
async function initializeForm() {
  try {
    // Set today's date
    document.getElementById('dispenseDate').value = new Date().toISOString().split('T')[0];
    
    // Load dropdown data
    await Promise.all([
      loadProducts(),
      loadWarehouses()
    ]);
  } catch (error) {
    console.error('Error initializing form:', error);
  }
}

// Load products
async function loadProducts() {
  try {
    console.log('Loading products from Firestore...');
    const snapshot = await getDocs(collection(db, 'products'));
    console.log('Products snapshot size:', snapshot.size);
    
    products = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    console.log('Products loaded:', products);
    
    // Update all product selects
    updateProductSelects();
  } catch (error) {
    console.error('Error loading products:', error);
    showAlert('Error loading products: ' + error.message, 'error');
  }
}

// Load warehouses
async function loadWarehouses() {
  try {
    console.log('Loading warehouses from Firestore...');
    const snapshot = await getDocs(collection(db, 'warehouses'));
    console.log('Warehouses snapshot size:', snapshot.size);
    
    warehouses = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    console.log('Warehouses loaded:', warehouses);
    
    const warehouseSelect = document.getElementById('warehouse');
    warehouseSelect.innerHTML = '<option value="">Choose Warehouse</option>' +
      warehouses.map(warehouse => `<option value="${warehouse.id}">${warehouse.name}</option>`).join('');
  } catch (error) {
    console.error('Error loading warehouses:', error);
    showAlert('Error loading warehouses: ' + error.message, 'error');
  }
}

// Update product selects
function updateProductSelects() {
  document.querySelectorAll('.product-select').forEach(select => {
    const currentValue = select.value;
    select.innerHTML = '<option value="">Choose Part</option>' +
      products.map(product => `<option value="${product.id}">${product.name}</option>`).join('');
    select.value = currentValue;
  });
}

// Add new item row
function addNewItem() {
  const container = document.getElementById('itemsContainer');
  const itemRow = document.createElement('div');
  itemRow.className = 'item-row';
  
  itemRow.innerHTML = `
    <select class="product-select" onchange="updateProductDetails(this)">
      <option value="">Choose Part</option>
      ${products.map(product => `<option value="${product.id}">${product.name}</option>`).join('')}
    </select>
    <input type="number" class="quantity" placeholder="Quantity" min="1" onchange="calculateItemTotal(this)">
    <input type="number" class="price" placeholder="Cost" step="0.01" min="0" onchange="calculateItemTotal(this)">
    <input type="number" class="total" placeholder="Total" readonly>
    <button type="button" class="btn btn-danger" onclick="removeItem(this)">×</button>
  `;
  
  container.appendChild(itemRow);
}

// Remove item row
function removeItem(button) {
  const row = button.closest('.item-row');
  if (document.querySelectorAll('.item-row').length > 1) {
    row.remove();
    calculateDispenseTotal();
  }
}

// Update product details
function updateProductDetails(select) {
  const productId = select.value;
  const row = select.closest('.item-row');
  const priceInput = row.querySelector('.price');
  
  if (productId) {
    const product = products.find(p => p.id === productId);
    if (product) {
      priceInput.value = product.purchasePrice || 0;
      calculateItemTotal(row.querySelector('.quantity'));
    }
  } else {
    priceInput.value = '';
    row.querySelector('.quantity').value = '';
    row.querySelector('.total').value = '';
    calculateDispenseTotal();
  }
}

// Calculate item total
function calculateItemTotal(input) {
  const row = input.closest('.item-row');
  const quantity = parseFloat(row.querySelector('.quantity').value) || 0;
  const price = parseFloat(row.querySelector('.price').value) || 0;
  const total = quantity * price;
  
  row.querySelector('.total').value = total.toFixed(2);
  calculateDispenseTotal();
}

// Calculate dispense total
function calculateDispenseTotal() {
  let subtotal = 0;
  
  document.querySelectorAll('.item-row').forEach(row => {
    const total = parseFloat(row.querySelector('.total').value) || 0;
    subtotal += total;
  });
  
  document.getElementById('subtotal').textContent = subtotal.toFixed(2);
  document.getElementById('total').textContent = subtotal.toFixed(2);
}

// Form submission
document.getElementById('dispenseForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  try {
    console.log('Submitting dispense form...');
    
    const formData = {
      type: 'dispense',
      vehicleNumber: document.getElementById('vehicleNumber').value,
      driverName: document.getElementById('driverName').value,
      warehouseId: document.getElementById('warehouse').value,
      date: new Date(document.getElementById('dispenseDate').value),
      total: parseFloat(document.getElementById('total').textContent),
      items: [],
      createdAt: serverTimestamp()
    };
    
    console.log('Form data:', formData);
    
    // Collect items
    document.querySelectorAll('.item-row').forEach(row => {
      const productId = row.querySelector('.product-select').value;
      const quantity = parseFloat(row.querySelector('.quantity').value) || 0;
      const price = parseFloat(row.querySelector('.price').value) || 0;
      const total = parseFloat(row.querySelector('.total').value) || 0;
      
      if (productId && quantity > 0) {
        formData.items.push({
          productId,
          quantity,
          price,
          total
        });
      }
    });
    
    if (formData.items.length === 0) {
      showAlert('Must add at least one part', 'error');
      return;
    }
    
    console.log('Creating dispense with items:', formData.items);
    
    // Create dispense with transaction
    await createDispenseWithTransaction(formData);
    
    showAlert('Issue order created successfully', 'success');
    resetForm();
    loadRecentDispenses();
  } catch (error) {
    console.error('Error creating dispense:', error);
    showAlert('Error creating issue order: ' + error.message, 'error');
  }
});

// Create dispense with transaction
async function createDispenseWithTransaction(dispenseData) {
  console.log('Starting transaction for dispense...');
  
  await runTransaction(db, async (transaction) => {
    // Create dispense record
    const dispenseRef = doc(collection(db, 'dispenses'));
    console.log('Creating dispense record with ID:', dispenseRef.id);
    
    transaction.set(dispenseRef, {
      type: dispenseData.type,
      vehicleNumber: dispenseData.vehicleNumber,
      driverName: dispenseData.driverName,
      warehouseId: dispenseData.warehouseId,
      total: dispenseData.total,
      date: dispenseData.date,
      status: 'active',
      createdAt: dispenseData.createdAt
    });
    
    // Create dispense items and update stock
    for (const item of dispenseData.items) {
      console.log('Processing item:', item);
      
      // Create dispense item
      const itemRef = doc(collection(db, 'dispense_items'));
      transaction.set(itemRef, {
        dispenseId: dispenseRef.id,
        productId: item.productId,
        quantity: item.quantity,
        price: item.price,
        total: item.total
      });
      
      // Get product info
      const product = products.find(p => p.id === item.productId);
      if (!product) {
        console.error('Product not found:', item.productId);
        continue;
      }
      
      // Update stock balance
      const stockId = `${item.productId}_${dispenseData.warehouseId}`;
      const stockRef = doc(collection(db, 'stock_balances'), stockId);
      const stockDoc = await transaction.get(stockRef);
      
      let currentQuantity = 0;
      let currentAvgCost = 0;
      
      if (stockDoc.exists) {
        const stockData = stockDoc.data();
        currentQuantity = stockData.quantity || 0;
        currentAvgCost = stockData.avgCost || 0;
      }
      
      // Check if sufficient quantity available
      if (currentQuantity < item.quantity) {
        throw new Error(`Insufficient quantity for ${product.name}. Available: ${currentQuantity}, Required: ${item.quantity}`);
      }
      
      const newQuantity = currentQuantity - item.quantity;
      
      // Update stock balance
      transaction.set(stockRef, {
        productId: item.productId,
        warehouseId: dispenseData.warehouseId,
        quantity: newQuantity,
        avgCost: currentAvgCost,
        updatedAt: serverTimestamp()
      });
      
      // Create stock movement
      const movementRef = doc(collection(db, 'stock_movements'));
      transaction.set(movementRef, {
        type: 'dispense',
        productId: item.productId,
        warehouseId: dispenseData.warehouseId,
        quantity: -item.quantity,
        unitCost: item.price,
        totalCost: item.total,
        referenceType: 'dispense',
        referenceId: dispenseRef.id,
        vehicleNumber: dispenseData.vehicleNumber,
        driverName: dispenseData.driverName,
        date: dispenseData.date,
        createdBy: auth.currentUser.uid,
        createdAt: serverTimestamp()
      });
      
      console.log('Stock movement created for item:', item.productId);
    }
  });
  
  console.log('Transaction completed successfully');
}

// Load recent dispenses
async function loadRecentDispenses() {
  try {
    console.log('Loading recent dispenses...');
    const snapshot = await getDocs(query(collection(db, 'dispenses'), orderBy('createdAt', 'desc'), limit(10)));
    
    const container = document.getElementById('recentDispenses');
    
    if (snapshot.empty) {
      container.innerHTML = '<p style="text-align: center; color: #7f8c8d;">No dispenses found</p>';
      return;
    }
    
    container.innerHTML = snapshot.docs.map(doc => {
      const dispense = doc.data();
      
      return `
        <div class="dispense-item">
          <div class="dispense-info">
            <div class="dispense-id">Issue Order #${doc.id.substring(0, 8)}</div>
            <div class="dispense-date">${new Date(dispense.createdAt.toDate()).toLocaleDateString('ar-EG')}</div>
            <div>Vehicle: ${dispense.vehicleNumber} | Driver: ${dispense.driverName}</div>
          </div>
          <span class="dispense-total">${dispense.total.toFixed(2)} EGP</span>
        </div>
      `;
    }).join('');
  } catch (error) {
    console.error('Error loading recent dispenses:', error);
    document.getElementById('recentDispenses').innerHTML = '<p style="color: #e74c3c;">Error loading dispenses</p>';
  }
}

// Collect scrap
function collectScrap() {
  document.getElementById('scrapModal').style.display = 'flex';
}

// Close scrap modal
function closeScrapModal() {
  document.getElementById('scrapModal').style.display = 'none';
  document.getElementById('scrapForm').reset();
}

// Scrap form submission
document.getElementById('scrapForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  try {
    const scrapData = {
      partName: document.getElementById('scrapPartName').value,
      quantity: parseInt(document.getElementById('scrapQuantity').value),
      condition: document.getElementById('scrapCondition').value,
      notes: document.getElementById('scrapNotes').value,
      warehouseId: document.getElementById('warehouse').value,
      date: new Date(document.getElementById('dispenseDate').value),
      createdAt: serverTimestamp()
    };
    
    // Create scrap product if not exists
    const scrapProductRef = db.collection('products').doc();
    await setDoc(scrapProductRef, {
      name: scrapData.partName,
      unit: 'piece',
      categoryId: 'scrap_used',
      purchasePrice: 0,
      salePrice: 0,
      minStock: 0,
      createdAt: serverTimestamp()
    });
    
    // Add to stock balances
    const stockId = `${scrapProductRef.id}_${scrapData.warehouseId}`;
    const stockRef = db.collection('stock_balances').doc(stockId);
    await setDoc(stockRef, {
      productId: scrapProductRef.id,
      warehouseId: scrapData.warehouseId,
      quantity: scrapData.quantity,
      avgCost: 0,
      updatedAt: serverTimestamp()
    });
    
    // Create movement
    const movementRef = db.collection('stock_movements').doc();
    await setDoc(movementRef, {
      type: 'scrap_in',
      productId: scrapProductRef.id,
      warehouseId: scrapData.warehouseId,
      quantity: scrapData.quantity,
      unitCost: 0,
      totalCost: 0,
      referenceType: 'scrap_collection',
      referenceId: movementRef.id,
      date: scrapData.date,
      notes: scrapData.notes,
      createdBy: auth.currentUser.uid,
      createdAt: serverTimestamp()
    });
    
    showAlert('Scrap received successfully', 'success');
    closeScrapModal();
    loadProducts(); // Reload products to include new scrap
  } catch (error) {
    console.error('Error collecting scrap:', error);
    showAlert('Error collecting scrap: ' + error.message, 'error');
  }
});

// Reset form
function resetForm() {
  document.getElementById('dispenseForm').reset();
  document.getElementById('dispenseDate').value = new Date().toISOString().split('T')[0];
  
  // Reset items to single row
  const container = document.getElementById('itemsContainer');
  container.innerHTML = `
    <div class="item-row">
      <select class="product-select" onchange="updateProductDetails(this)">
        <option value="">Choose Part</option>
        ${products.map(product => `<option value="${product.id}">${product.name}</option>`).join('')}
      </select>
      <input type="number" class="quantity" placeholder="Quantity" min="1" onchange="calculateItemTotal(this)">
      <input type="number" class="price" placeholder="Cost" step="0.01" min="0" onchange="calculateItemTotal(this)">
      <input type="number" class="total" placeholder="Total" readonly>
      <button type="button" class="btn btn-danger" onclick="removeItem(this)">×</button>
    </div>
  `;
  
  calculateDispenseTotal();
}

// Show alert
function showAlert(message, type) {
  const alertDiv = document.createElement('div');
  alertDiv.className = `alert alert-${type}`;
  alertDiv.textContent = message;
  
  document.querySelector('.container').insertBefore(alertDiv, document.querySelector('.main-content'));
  
  setTimeout(() => {
    alertDiv.remove();
  }, 3000);
}

// Navigation functions
function goBack() {
  window.location.href = "inventory-management.html";
}

function logout() {
  auth.signOut().then(() => {
    window.location = "index.html";
  });
}
</script>
