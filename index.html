<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تطبيق الأسعار - ديناميكي</title>

<style>
body { font-family: Arial; padding: 15px; background:#eef2f7; margin:0; }
.container { max-width:900px; margin:auto; }
.header { text-align:center; margin-bottom:20px; }
input { padding:12px; width:100%; border-radius:10px; border:1px solid #ccc; margin-bottom:15px; font-size:16px; }

table { width:100%; border-collapse: collapse; background:#fff; border-radius:10px; overflow:hidden; }
th, td { border:1px solid #ddd; padding:10px; text-align:center; }
th { background:#2c3e50; color:#fff; }

.edit-btn {
  padding:10px;
  width:100%;
  border:none;
  border-radius:10px;
  background:#27ae60;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

#addRowButton {
  margin-top:10px;
  padding:10px;
  width:100%;
  border:none;
  border-radius:10px;
  background:#3498db;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">
  <div class="header">
    <img src="logo.png" style="max-width:150px;">
    <h2>📦 أسعار الحاويات</h2>
  </div>

  <!-- تسجيل دخول -->
  <div id="loginDiv">
    <input type="text" id="username" placeholder="اسم المستخدم">
    <input type="password" id="password" placeholder="كلمة السر">
    <button onclick="login()">تسجيل الدخول</button>
  </div>

  <input type="text" id="search" placeholder="بحث..." onkeyup="searchData()">

  <table>
    <thead>
      <tr>
        <th>العميل</th>
        <th>المكان</th>
        <th>20</th>
        <th>40</th>
        <th>2×20</th>
        <th>قومسيون</th>
        <th>20</th>
        <th>40</th>
        <th>2×20</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <button class="edit-btn" onclick="saveData()" id="saveBtn" disabled>💾 حفظ التعديلات</button>
  <button id="addRowButton">➕ إضافة بيانات جديدة</button>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// Firebase
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "trialsafaprices2026.firebaseapp.com",
  databaseURL: "https://trialsafaprices2026-default-rtdb.firebaseio.com",
  projectId: "trialsafaprices2026",
  storageBucket: "trialsafaprices2026.appspot.com",
  messagingSenderId: "177091434445",
  appId: "1:177091434445:web:568b6ae3ba270a21d4d684"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

// بيانات
const users = [
  {username:"ahmed", password:"1234"},
  {username:"hesham", password:"1234"},
  {username:"omar", password:"1234"},
  {username:"sabry", password:"1234"}
];

let data = [];
const commission = 500;

// تسجيل دخول
function login(){
  const u = username.value;
  const p = password.value;

  const user = users.find(x=>x.username===u && x.password===p);

  if(user){
    loginDiv.style.display="none";
    saveBtn.disabled = false;
    loadData();
  }else{
    alert("بيانات غلط");
  }
}

// تحميل البيانات
function loadData(){
  database.ref('prices').on('value', snapshot=>{
    data = snapshot.val() || [];
    renderTable(data);
  });
}

// عرض الجدول
function renderTable(arr){
  tableBody.innerHTML = "";

  arr.forEach((row,index)=>{
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td contenteditable="true">${row.clientName||""}</td>
      <td contenteditable="true">${row.place||""}</td>
      <td contenteditable="true">${row.market?.c20||0}</td>
      <td contenteditable="true">${row.market?.c40||0}</td>
      <td contenteditable="true">${row.market?.c2x20||0}</td>
      <td>${row.commission||commission}</td>
      <td contenteditable="true">${row.client?.c20||0}</td>
      <td contenteditable="true">${row.client?.c40||0}</td>
      <td contenteditable="true">${row.client?.c2x20||0}</td>
    `;

    tr.setAttribute("data-index", index);
    tableBody.appendChild(tr);
  });
}

// البحث
function searchData(){
  const q = search.value.toLowerCase();

  const filtered = data.filter(row =>
    (row.place||"").toLowerCase().includes(q) ||
    (row.clientName||"").toLowerCase().includes(q)
  );

  renderTable(filtered);
}

// حفظ بدون مسح البيانات
function saveData(){
  const rows = document.querySelectorAll("#tableBody tr");

  rows.forEach(tr=>{
    const index = tr.getAttribute("data-index");

    const updated = {
      clientName: tr.children[0].innerText,
      place: tr.children[1].innerText,
      market:{
        c20:+tr.children[2].innerText||0,
        c40:+tr.children[3].innerText||0,
        c2x20:+tr.children[4].innerText||0
      },
      commission: commission,
      client:{
        c20:+tr.children[6].innerText||0,
        c40:+tr.children[7].innerText||0,
        c2x20:+tr.children[8].innerText||0
      }
    };

    if(index !== null){
      database.ref('prices/'+index).set(updated);
    }
  });

  alert("تم الحفظ بدون مسح البيانات ✅");
}

// إضافة سطر جديد
addRowButton.onclick = ()=>{
  const tr = document.createElement("tr");

  tr.innerHTML = `
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true">0</td>
    <td contenteditable="true">0</td>
    <td contenteditable="true">0</td>
    <td>${commission}</td>
    <td contenteditable="true">0</td>
    <td contenteditable="true">0</td>
    <td contenteditable="true">0</td>
  `;

  tableBody.appendChild(tr);

  // مهم: نضيفه في الداتا كعنصر جديد
  const newIndex = data.length;
  tr.setAttribute("data-index", newIndex);
  data.push({});
};
</script>

</body>
</html>
