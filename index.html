<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - مكتب الصفا</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  overflow: hidden;
}

/* خلفية بلور */
body::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: url("logo.png") no-repeat center center;
  background-size: 60%;
  filter: blur(20px);
  opacity: 0.2;
  z-index: 0;
}

/* صندوق تسجيل الدخول */
.login-box {
  position: relative;
  z-index: 1;
  background: rgba(255,255,255,0.95);
  padding: 30px;
  border-radius: 15px;
  width: 320px;
  text-align: center;
  box-shadow: 0 0 20px rgba(0,0,0,0.2);
}

/* اللوجو */
.login-box img {
  width: 120px;
  margin-bottom: 10px;
  animation: float 2s ease-in-out infinite alternate;
}

/* حركة اللوجو */
@keyframes float {
  from { transform: translateY(0px); }
  to { transform: translateY(-10px); }
}

h3 {
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 16px;
}

/* زر */
button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #3498db;
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #2980b9;
}
</style>
</head>

<body>

<div class="login-box">
  <img src="logo.png" alt="logo">
  <h3>أسعار نقلات مكتب الصفا - 2026</h3>

  <input type="text" id="username" placeholder="اسم المستخدم">
  <input type="password" id="password" placeholder="كلمة السر">

  <button onclick="login()">تسجيل الدخول</button>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyARqSgfh78TqFQ2hhZaAtUaVQFqlPuRM3w",
  authDomain: "trialsafaprices2026.firebaseapp.com",
  projectId: "trialsafaprices2026",
  storageBucket: "trialsafaprices2026.appspot.com",
  messagingSenderId: "177091434445",
  appId: "1:177091434445:web:568b6ae3ba270a21d4d684"
};

firebase.initializeApp(firebaseConfig);

/* ربط اليوزر بالإيميل */
const usersMap = {
  "ahmed": "ahmed@safatrans.com",
  "hesham": "hesham@safatrans.com",
  "omar": "omar@safatrans.com",
  "sabry": "sabry@safatrans.com"
};

function login(){
  const username = document.getElementById("username").value.trim().toLowerCase();
  const password = document.getElementById("password").value;

  const email = usersMap[username];

  if(!email){
    alert("اسم المستخدم غير صحيح ❌");
    return;
  }

  firebase.auth().signInWithEmailAndPassword(email, password)
  .then(()=>{
    window.location.href = "dashboard.html";
  })
  .catch(()=>{
    alert("كلمة السر غير صحيحة ❌");
  });
}
</script>

</body>
</html>
