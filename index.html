<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - أسعار مكتب الصفا</title>
<style>
body {
  font-family: Arial; margin:0; padding:0;
  background: url('logo.png') no-repeat center center fixed;
  background-size: cover; filter: blur(8px);
}
.overlay {
  position: fixed; top:0; left:0; width:100%; height:100%;
  background: rgba(0,0,0,0.5);
  display:flex; justify-content:center; align-items:center;
}
.login-box {
  background:#fff; padding:30px; border-radius:15px; text-align:center;
  box-shadow: 0 5px 20px rgba(0,0,0,0.3);
  animation: fadeIn 1s ease-in-out;
}
.login-box img {
  max-width:150px; margin-bottom:10px; animation: logoMove 2s infinite alternate;
}
input { display:block; width:100%; margin:10px 0; padding:12px; border-radius:10px; border:1px solid #ccc; font-size:16px; }
button {
  padding:12px; width:100%; background:#27ae60; color:#fff; border:none; border-radius:10px; font-size:16px; cursor:pointer;
}
button:hover { background:#2ecc71; }
@keyframes logoMove { 0%{transform: translateY(0);} 100%{transform: translateY(-10px);} }
@keyframes fadeIn { 0%{opacity:0;} 100%{opacity:1;} }
</style>
</head>
<body>
<div class="overlay">
  <div class="login-box">
    <img src="logo.png" alt="Logo">
    <h2>أسعار نقلات مكتب الصفا - 2026</h2>
    <input type="text" id="username" placeholder="اسم المستخدم">
    <input type="password" id="password" placeholder="كلمة السر">
    <button onclick="login()">تسجيل الدخول</button>
  </div>
</div>

<script>
const users = [
  {username:"ahmed", password:"1234"},
  {username:"hesham", password:"1234"},
  {username:"omar", password:"1234"},
  {username:"sabry", password:"1234"}
];

function login(){
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;
  const user = users.find(x=>x.username===u && x.password===p);
  if(user) {
    localStorage.setItem('currentUser', u);
    window.location.href = 'dashboard.html';
  } else alert('خطأ في اسم المستخدم أو كلمة السر');
}
</script>
</body>
</html>
