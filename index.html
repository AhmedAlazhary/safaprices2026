<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAFA Trans Prices APP 2026</title>

<style>
body { font-family: Arial; padding: 15px; background:#eef2f7; margin:0; }
.container { max-width:900px; margin:auto; }

.header { text-align:center; margin-bottom:20px; }

input {
  padding:12px;
  width:100%;
  border-radius:10px;
  border:1px solid #ccc;
  margin-bottom:15px;
  font-size:16px;
}

table {
  width:100%;
  border-collapse: collapse;
  background:#fff;
  border-radius:10px;
  overflow:hidden;
}

th, td {
  border:1px solid #ddd;
  padding:10px;
  text-align:center;
}

th {
  background:#2c3e50;
  color:#fff;
}

.edit-btn {
  padding:10px;
  width:100%;
  border:none;
  border-radius:10px;
  background:#27ae60;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

#addRowButton {
  margin-top:10px;
  padding:10px;
  width:100%;
  border:none;
  border-radius:10px;
  background:#3498db;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <img src="logo.png" style="max-width:250px;">
    <h2>📦 أسعار الحاويات</h2>
    <h3 style="color:#555;">أسعار نقلات مكتب الصفا - 2026</h3>
  </div>

  <input type="text" id="search" placeholder="بحث..." onkeyup="searchData()">

  <table>
    <thead>
      <tr>
        <th>التاريخ</th>
        <th>المكان</th>
        <th>20(سوق)</th>
        <th>40(سوق)</th>
        <th>2×20(سوق)</th>
        <th>قومسيون</th>
        <th>20(عميل)</th>
        <th>40(عميل)</th>
        <th>2×20(عميل)</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <button class="edit-btn" onclick="saveData()">💾 حفظ التعديلات</button>
  <button id="addRowButton">➕ إضافة بيانات جديدة</button>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>

// 🔒 حماية الصفحة
const user = localStorage.getItem("user");
if(!user){
  window.location.href = "login.html";
}

// Firebase
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "trialsafaprices2026.firebaseapp.com",
  databaseURL: "https://trialsafaprices2026-default-rtdb.firebaseio.com",
  projectId: "trialsafaprices2026",
  storageBucket: "trialsafaprices2026.appspot.com",
  messagingSenderId: "177091434445",
  appId: "1:177091434445:web:568b6ae3ba270a21d4d684"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

let data = [];
let isSearching = false;
const commission = 500;

// تحميل
function loadData(){
  database.ref('prices').on('value', snapshot=>{
    data = snapshot.val() || [];
    renderTable(data);
  });
}
loadData();

// عرض
function renderTable(arr){
  tableBody.innerHTML = "";

  arr.forEach((row,index)=>{
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td contenteditable="true">${row.clientName||""}</td>
      <td contenteditable="true">${row.place||""}</td>
      <td contenteditable="true">${row.market?.c20||0}</td>
      <td contenteditable="true">${row.market?.c40||0}</td>
      <td contenteditable="true">${row.market?.c2x20||0}</td>
      <td>${row.commission||commission}</td>
      <td contenteditable="true">${row.client?.c20||0}</td>
      <td contenteditable="true">${row.client?.c40||0}</td>
      <td contenteditable="true">${row.client?.c2x20||0}</td>
    `;

    tr.setAttribute("data-index", index);
    tableBody.appendChild(tr);
  });
}

// بحث
function searchData(){
  const q = search.value.toLowerCase();

  if(q === ""){
    isSearching = false;
    renderTable(data);
    return;
  }

  isSearching = true;

  const filtered = data.filter(row =>
    (row.place||"").toLowerCase().includes(q) ||
    (row.clientName||"").toLowerCase().includes(q)
  );

  renderTable(filtered);
}

// حفظ
function saveData(){
  const rows = document.querySelectorAll("#tableBody tr");

  rows.forEach(tr=>{
    const index = tr.getAttribute("data-index");

    const updated = {
      clientName: tr.children[0].innerText,
      place: tr.children[1].innerText,
      market:{
        c20:+tr.children[2].innerText||0,
        c40:+tr.children[3].innerText||0,
        c2x20:+tr.children[4].innerText||0
      },
      commission: commission,
      client:{
        c20:+tr.children[6].innerText||0,
        c40:+tr.children[7].innerText||0,
        c2x20:+tr.children[8].innerText||0
      }
    };

    if(index !== null){
      database.ref('prices/'+index).set(updated);
    }
  });

  alert("تم الحفظ  ✅");
}

// إضافة
addRowButton.onclick = ()=>{

  if(isSearching){
    alert("❌ امسح البحث الأول قبل الإضافة");
    return;
  }

  const tr = document.createElement("tr");

  tr.innerHTML = `
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true">0</td>
    <td contenteditable="true">0</td>
    <td contenteditable="true">0</td>
    <td>${commission}</td>
    <td contenteditable="true">0</td>
    <td contenteditable="true">0</td>
    <td contenteditable="true">0</td>
  `;

  tableBody.appendChild(tr);

  const newIndex = data.length;
  tr.setAttribute("data-index", newIndex);

  data.push({});
};
</script>

</body>
</html>
