<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم</title>
<style>
body { font-family: Arial; text-align:center; padding:50px; background:#eef2f7; }
button {
  padding:15px 30px; margin:20px; font-size:18px;
  border:none; border-radius:10px; cursor:pointer; background:#3498db; color:#fff;
}
button:hover { background:#2980b9; }
</style>
</head>
<body>
<h1>أهلا بك في نظام مكتب الصفا</h1>
<button onclick="window.location.href='prices.html'">جدول الأسعار</button>
<button onclick="window.location.href='daily-report.html'">بيان الشغل اليومي</button>
<button onclick="logout()">تسجيل الخروج</button>

<script>
function logout(){
  localStorage.removeItem('currentUser');
  window.location.href = 'index.html';
}

// منع الدخول بدون تسجيل
if(!localStorage.getItem('currentUser')){
  window.location.href = 'index.html';
}
</script>
</body>
</html>
