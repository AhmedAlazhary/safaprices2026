<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حركات المخزون - نظام المخازن</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
}

header {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
  padding: 1rem 2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
}

header img {
  height: 50px;
}

header h1 {
  color: #2c3e50;
  font-size: 1.8rem;
}

header nav {
  display: flex;
  gap: 1rem;
}

header nav button {
  background: #3498db;
  color: white;
  border: none;
  padding: 0.5rem 1rem;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s ease;
}

header nav button:hover {
  background: #2980b9;
  transform: translateY(-2px);
}

.container {
  max-width: 1400px;
  margin: 2rem auto;
  padding: 0 1rem;
}

.filters-section {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  border-radius: 16px;
  padding: 1.5rem;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
  margin-bottom: 2rem;
}

.filters-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
  margin-bottom: 1rem;
}

.form-group {
  display: flex;
  flex-direction: column;
}

.form-group label {
  margin-bottom: 0.5rem;
  color: #2c3e50;
  font-weight: 500;
}

.form-group input,
.form-group select {
  padding: 0.75rem;
  border: 2px solid #e0e0e0;
  border-radius: 8px;
  font-size: 1rem;
  transition: border-color 0.3s ease;
}

.form-group input:focus,
.form-group select:focus {
  outline: none;
  border-color: #3498db;
}

.btn {
  padding: 0.75rem 1.5rem;
  border: none;
  border-radius: 8px;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.3s ease;
  font-weight: 500;
}

.btn-primary {
  background: #3498db;
  color: white;
}

.btn-primary:hover {
  background: #2980b9;
  transform: translateY(-2px);
}

.btn-secondary {
  background: #95a5a6;
  color: white;
}

.btn-secondary:hover {
  background: #7f8c8d;
  transform: translateY(-2px);
}

.table-container {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  border-radius: 16px;
  padding: 1.5rem;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
}

th {
  background: #3498db;
  color: white;
  padding: 1rem;
  text-align: right;
  font-weight: 600;
  position: sticky;
  top: 0;
  z-index: 10;
}

td {
  padding: 1rem;
  border-bottom: 1px solid #ecf0f1;
  text-align: right;
}

tr:hover {
  background: #f8f9fa;
}

.movement-type {
  padding: 0.25rem 0.75rem;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: bold;
}

.type-sale {
  background: #d4edda;
  color: #155724;
}

.type-purchase {
  background: #cce5ff;
  color: #004085;
}

.type-transfer {
  background: #fff3cd;
  color: #856404;
}

.type-adjustment {
  background: #f8d7da;
  color: #721c24;
}

.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 1rem;
  margin-top: 1.5rem;
}

.pagination button {
  padding: 0.5rem 1rem;
  border: 1px solid #3498db;
  background: white;
  color: #3498db;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.pagination button:hover:not(:disabled) {
  background: #3498db;
  color: white;
}

.pagination button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.pagination .current-page {
  background: #3498db;
  color: white;
}

.loading {
  text-align: center;
  padding: 2rem;
}

.spinner {
  border: 4px solid #f3f3f3;
  border-top: 4px solid #3498db;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  animation: spin 1s linear infinite;
  margin: 0 auto;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@media (max-width: 768px) {
  header {
    flex-direction: column;
    gap: 1rem;
  }
  
  .filters-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <div style="display: flex; align-items: center; gap: 1rem;">
    <img src="logo.png" alt="شعار مكتب الصفا">
    <h1>حركات المخزون</h1>
  </div>
  <nav>
    <button onclick="window.location='inventory-management.html'">الرئيسية</button>
    <button onclick="goBack()">رجوع</button>
    <button onclick="logout()">تسجيل خروج</button>
  </nav>
</header>

<div class="container">
  <!-- Filters Section -->
  <div class="filters-section">
    <h2 style="margin-bottom: 1rem; color: #2c3e50;">الفلاتر</h2>
    <div class="filters-grid">
      <div class="form-group">
        <label for="productFilter">الصنف</label>
        <select id="productFilter">
          <option value="">كل الأصناف</option>
        </select>
      </div>
      <div class="form-group">
        <label for="warehouseFilter">المخزن</label>
        <select id="warehouseFilter">
          <option value="">كل المخازن</option>
        </select>
      </div>
      <div class="form-group">
        <label for="typeFilter">نوع الحركة</label>
        <select id="typeFilter">
          <option value="">كل الأنواع</option>
          <option value="sale">بيع</option>
          <option value="purchase">شراء</option>
          <option value="transfer">تحويل</option>
          <option value="adjustment">تعديل</option>
        </select>
      </div>
      <div class="form-group">
        <label for="dateFromFilter">من تاريخ</label>
        <input type="date" id="dateFromFilter">
      </div>
      <div class="form-group">
        <label for="dateToFilter">إلى تاريخ</label>
        <input type="date" id="dateToFilter">
      </div>
    </div>
    <div style="display: flex; gap: 1rem;">
      <button class="btn btn-primary" onclick="applyFilters()">تطبيق الفلاتر</button>
      <button class="btn btn-secondary" onclick="clearFilters()">مسح الفلاتر</button>
      <button class="btn btn-primary" onclick="exportMovements()">تصدير Excel</button>
    </div>
  </div>

  <!-- Movements Table -->
  <div class="table-container">
    <h2 style="margin-bottom: 1rem; color: #2c3e50;">سجل الحركات</h2>
    <table id="movementsTable">
      <thead>
        <tr>
          <th>التاريخ</th>
          <th>الصنف</th>
          <th>المخزن</th>
          <th>نوع الحركة</th>
          <th>الكمية</th>
          <th>سعر الوحدة</th>
          <th>الإجمالي</th>
          <th>المرجع</th>
          <th>المستخدم</th>
        </tr>
      </thead>
      <tbody id="movementsTableBody">
        <tr>
          <td colspan="9" class="loading">
            <div class="spinner"></div>
          </td>
        </tr>
      </tbody>
    </table>
    
    <!-- Pagination -->
    <div class="pagination" id="pagination">
      <button onclick="previousPage()" id="prevBtn" disabled>السابق</button>
      <span id="pageInfo">صفحة 1 من 1</span>
      <button onclick="nextPage()" id="nextBtn" disabled>التالي</button>
    </div>
  </div>
</div>

<script type="module">
import { auth, db, serverTimestamp } from './firebase-config.js';

// Check authentication
auth.onAuthStateChanged(user => {
  if (!user) {
    window.location = "index.html";
    return;
  }
  
  // Load data
  loadData();
});

// Global variables
let allMovements = [];
let filteredMovements = [];
let products = [];
let warehouses = [];
let currentPage = 1;
const itemsPerPage = 20;

// Load all data
async function loadData() {
  try {
    await Promise.all([
      loadProducts(),
      loadWarehouses(),
      loadMovements()
    ]);
    
    renderMovementsTable();
  } catch (error) {
    console.error('Error loading data:', error);
  }
}

// Load products
async function loadProducts() {
  try {
    const snapshot = await db.collection('products').get();
    products = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    
    // Update product filter
    const productFilter = document.getElementById('productFilter');
    productFilter.innerHTML = '<option value="">كل الأصناف</option>' +
      products.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  } catch (error) {
    console.error('Error loading products:', error);
  }
}

// Load warehouses
async function loadWarehouses() {
  try {
    const snapshot = await db.collection('warehouses').get();
    warehouses = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    
    // Update warehouse filter
    const warehouseFilter = document.getElementById('warehouseFilter');
    warehouseFilter.innerHTML = '<option value="">كل المخازن</option>' +
      warehouses.map(w => `<option value="${w.id}">${w.name}</option>`).join('');
  } catch (error) {
    console.error('Error loading warehouses:', error);
  }
}

// Load movements
async function loadMovements() {
  try {
    const snapshot = await db.collection('stock_movements')
      .orderBy('date', 'desc')
      .get();
    
    allMovements = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    filteredMovements = [...allMovements];
  } catch (error) {
    console.error('Error loading movements:', error);
  }
}

// Render movements table
function renderMovementsTable() {
  const tbody = document.getElementById('movementsTableBody');
  
  if (filteredMovements.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; padding: 2rem;">لا توجد حركات</td></tr>';
    updatePagination();
    return;
  }
  
  // Calculate pagination
  const startIndex = (currentPage - 1) * itemsPerPage;
  const endIndex = startIndex + itemsPerPage;
  const pageMovements = filteredMovements.slice(startIndex, endIndex);
  
  tbody.innerHTML = pageMovements.map(movement => {
    const product = products.find(p => p.id === movement.productId);
    const warehouse = warehouses.find(w => w.id === movement.warehouseId);
    
    const typeClass = `type-${movement.type}`;
    const typeText = movement.type === 'sale' ? 'بيع' : 
                    movement.type === 'purchase' ? 'شراء' : 
                    movement.type === 'transfer' ? 'تحويل' : 'تعديل';
    
    const quantity = movement.quantity || 0;
    const unitCost = movement.unitCost || 0;
    const totalCost = movement.totalCost || 0;
    
    return `
      <tr>
        <td>${movement.date ? new Date(movement.date.toDate()).toLocaleDateString('ar-EG') : '-'}</td>
        <td>${product ? product.name : 'غير معروف'}</td>
        <td>${warehouse ? warehouse.name : 'غير معروف'}</td>
        <td><span class="movement-type ${typeClass}">${typeText}</span></td>
        <td>${quantity}</td>
        <td>${unitCost.toFixed(2)}</td>
        <td>${totalCost.toFixed(2)}</td>
        <td>${movement.referenceType || '-'}</td>
        <td>${movement.createdBy || '-'}</td>
      </tr>
    `;
  }).join('');
  
  updatePagination();
}

// Update pagination
function updatePagination() {
  const totalPages = Math.ceil(filteredMovements.length / itemsPerPage);
  const pageInfo = document.getElementById('pageInfo');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  
  pageInfo.textContent = `صفحة ${currentPage} من ${totalPages}`;
  prevBtn.disabled = currentPage <= 1;
  nextBtn.disabled = currentPage >= totalPages;
}

// Previous page
function previousPage() {
  if (currentPage > 1) {
    currentPage--;
    renderMovementsTable();
  }
}

// Next page
function nextPage() {
  const totalPages = Math.ceil(filteredMovements.length / itemsPerPage);
  if (currentPage < totalPages) {
    currentPage++;
    renderMovementsTable();
  }
}

// Apply filters
function applyFilters() {
  const productFilter = document.getElementById('productFilter').value;
  const warehouseFilter = document.getElementById('warehouseFilter').value;
  const typeFilter = document.getElementById('typeFilter').value;
  const dateFromFilter = document.getElementById('dateFromFilter').value;
  const dateToFilter = document.getElementById('dateToFilter').value;
  
  filteredMovements = allMovements.filter(movement => {
    if (productFilter && movement.productId !== productFilter) return false;
    if (warehouseFilter && movement.warehouseId !== warehouseFilter) return false;
    if (typeFilter && movement.type !== typeFilter) return false;
    
    if (dateFromFilter && movement.date) {
      const movementDate = new Date(movement.date.toDate());
      const fromDate = new Date(dateFromFilter);
      if (movementDate < fromDate) return false;
    }
    
    if (dateToFilter && movement.date) {
      const movementDate = new Date(movement.date.toDate());
      const toDate = new Date(dateToFilter);
      toDate.setHours(23, 59, 59, 999);
      if (movementDate > toDate) return false;
    }
    
    return true;
  });
  
  currentPage = 1;
  renderMovementsTable();
}

// Clear filters
function clearFilters() {
  document.getElementById('productFilter').value = '';
  document.getElementById('warehouseFilter').value = '';
  document.getElementById('typeFilter').value = '';
  document.getElementById('dateFromFilter').value = '';
  document.getElementById('dateToFilter').value = '';
  
  filteredMovements = [...allMovements];
  currentPage = 1;
  renderMovementsTable();
}

// Export movements to Excel
function exportMovements() {
  // Create CSV content
  const headers = ['التاريخ', 'الصنف', 'المخزن', 'نوع الحركة', 'الكمية', 'سعر الوحدة', 'الإجمالي', 'المرجع', 'المستخدم'];
  
  const csvContent = [
    headers.join(','),
    ...filteredMovements.map(movement => {
      const product = products.find(p => p.id === movement.productId);
      const warehouse = warehouses.find(w => w.id === movement.warehouseId);
      
      const typeText = movement.type === 'sale' ? 'بيع' : 
                      movement.type === 'purchase' ? 'شراء' : 
                      movement.type === 'transfer' ? 'تحويل' : 'تعديل';
      
      return [
        movement.date ? new Date(movement.date.toDate()).toLocaleDateString('ar-EG') : '',
        product ? product.name : 'غير معروف',
        warehouse ? warehouse.name : 'غير معروف',
        typeText,
        movement.quantity || 0,
        movement.unitCost || 0,
        movement.totalCost || 0,
        movement.referenceType || '',
        movement.createdBy || ''
      ].join(',');
    })
  ].join('\n');
  
  // Create download link
  const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  const url = URL.createObjectURL(blob);
  link.setAttribute('href', url);
  link.setAttribute('download', `stock_movements_${new Date().toISOString().split('T')[0]}.csv`);
  link.style.visibility = 'hidden';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// Navigation functions
function goBack() {
  window.location = "inventory-management.html";
}

function logout() {
  auth.signOut().then(() => {
    window.location = "index.html";
  });
}
</script>

</body>
</html>
